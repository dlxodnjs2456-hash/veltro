<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VELTRO ADMIN</title>
<style>
:root{--blue:#4258bd;--blue2:#2f7ed7;--nav:#fff;--line:#d8dde3;--soft:#f6f7f9;--text:#20242a;--muted:#7c8692;--danger:#ed4b43;--green:#2d9a5e}
*{box-sizing:border-box}body{margin:0;font-family:Arial,'Malgun Gothic',sans-serif;background:#eef1f4;color:var(--text);font-size:12px}button,input,select,textarea{font:inherit}.hidden{display:none!important}
.login-wrap{min-height:100vh;display:grid;place-items:center;background:#f3f5f8}.login-card{width:390px;background:#fff;border:1px solid #cfd5dc;padding:28px;box-shadow:0 7px 30px rgba(0,0,0,.08)}.login-card h2{margin:0 0 18px;font-size:20px}.login-card input{width:100%;height:38px;border:1px solid #b7c0c9;padding:0 10px;margin-bottom:9px}.login-card button{width:100%;height:40px;background:var(--blue2);color:#fff;border:0;font-weight:700;cursor:pointer}.msg{margin-top:8px;color:#d13e37;min-height:18px}
.app{min-height:100vh}.top{height:42px;background:var(--blue);color:#fff;display:flex;align-items:center;padding:0 14px;position:fixed;top:0;left:0;right:0;z-index:20}.brand{font-weight:800;letter-spacing:.5px}.brand small{font-weight:400;opacity:.8;margin-left:7px}.hamb{margin-left:110px;font-size:17px}.top-right{margin-left:auto;display:flex;gap:18px;align-items:center}.layout{display:grid;grid-template-columns:188px 1fr;padding-top:42px;min-height:100vh}.side{background:#fff;border-right:1px solid #d4d9de;position:fixed;top:42px;bottom:0;width:188px;overflow:auto}.side-logo{height:116px;background:linear-gradient(135deg,#325c5f,#24454c 58%,#ff5e22 58%,#ff5e22 70%,#203e44 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}.side-logo .mark{width:48px;height:48px;border-radius:50%;background:#ff6b39;display:grid;place-items:center;font-size:27px;font-weight:700;margin-bottom:8px}.side-logo b{font-size:11px}.side-logo span{font-size:9px;margin-top:3px}.menu-title{padding:12px 12px 6px;color:#9aa3ad;font-size:10px}.nav{display:block;width:100%;height:38px;border:0;border-top:1px solid #f0f1f2;background:#fff;text-align:left;padding:0 14px;cursor:pointer;color:#39424b}.nav:hover,.nav.active{background:#f1f3f5}.nav.active{color:#245ea9;font-weight:700}.nav:before{content:'⌂';margin-right:10px;color:#72808d}.main{grid-column:2;padding:14px 14px 26px;min-width:0}.crumb{height:26px;color:#7d8790;border-bottom:1px solid #cfd4d9;margin-bottom:10px}.page{background:#fff;border:1px solid #d2d7dc;border-radius:2px;padding:14px;min-height:calc(100vh - 100px)}.title{font-size:18px;font-weight:800;border-left:3px solid var(--blue);padding-left:10px;margin:0 0 16px}.filters{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.filters input,.filters select,.form input,.form select,.form textarea{border:1px solid #c5ccd3;background:#fff;height:31px;padding:0 8px}.filters input[type=date]{width:145px}.filters .grow{width:230px}.btn{height:31px;border:0;background:var(--blue2);color:#fff;padding:0 15px;cursor:pointer;border-radius:2px}.btn.red{background:var(--danger)}.btn.gray{background:#e7eaed;color:#333;border:1px solid #c2c8ce}.btn.green{background:var(--green)}.btn.small{height:25px;padding:0 9px;font-size:11px}.hint{font-size:11px;color:#8a949e;margin:8px 0}.warn{color:#ef423a;margin:7px 0}.table-wrap{overflow:auto;border:1px solid #d9dde1}.grid{width:100%;border-collapse:collapse;white-space:nowrap;font-size:11px}.grid th,.grid td{border-right:1px solid #d9dde1;border-bottom:1px solid #e3e6e9;height:31px;padding:5px 7px;text-align:center}.grid th{background:#eceeef;font-weight:700;position:sticky;top:0;z-index:1}.grid tr:hover td{background:#fafcff}.grid td.left{text-align:left}.grid tfoot td{background:#fafafa;font-weight:700}.num{text-align:right!important;font-variant-numeric:tabular-nums}.blue{color:#1c65b8}.redtxt{color:#d13c36}.green{color:#20804f}.search{margin-left:auto}.search input{border:0;border-bottom:1px solid #aeb6bf;width:180px;height:28px}.stat-row{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:9px;margin-bottom:13px}.stat{border:1px solid #d8dde2;background:#fafbfc;padding:11px}.stat span{display:block;color:#7a858f;font-size:10px;margin-bottom:6px}.stat b{font-size:17px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{border:1px solid #d4dae0;background:#fff;padding:12px;margin-bottom:12px}.card h3{font-size:13px;margin:0 0 10px}.form{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:8px}.form textarea{height:90px;padding:8px;grid-column:span 2}.form .full{grid-column:1/-1}.form-actions{margin-top:10px;display:flex;gap:6px}.pill{display:inline-block;padding:3px 7px;border-radius:10px;background:#edf1f5}.pill.active{background:#e4f4ea;color:#1f7849}.pill.suspended{background:#fde8e6;color:#b8352f}.actions{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;z-index:100}.modal{width:min(620px,92vw);max-height:86vh;overflow:auto;background:#fff;border:1px solid #808991;padding:16px;box-shadow:0 14px 50px rgba(0,0,0,.24)}.modal h3{margin:0 0 12px}.modal .form{grid-template-columns:1fr 1fr}.modal-close{float:right}.pwbox{max-width:520px}.pwbox input{display:block;width:100%;height:35px;border:1px solid #bdc5cd;margin:8px 0;padding:0 9px}.empty{height:240px;display:grid;place-items:center;color:#8b949c}.tag-bank{color:#2e63a9}.tag-crypto{color:#7c4fb3}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{display:none}.main{grid-column:1}.stat-row{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="loginScreen" class="login-wrap"><div class="login-card"><h2>관리자 로그인</h2><input id="loginId" placeholder="아이디"><input id="password" type="password" placeholder="비밀번호"><button id="loginBtn">로그인</button><div id="loginMsg" class="msg"></div></div></div>
<div id="app" class="app hidden">
  <div class="top"><div class="brand">VELTRO <small>ADMIN</small></div><div class="hamb">☰</div><div class="top-right"><span id="adminName">superadmin</span><button class="btn small gray" onclick="logout()">로그아웃</button></div></div>
  <div class="layout">
    <aside class="side"><div class="side-logo"><div class="mark">V</div><b>VELTRO</b><span>ADMIN v1.0</span></div><div class="menu-title">메뉴</div>
      <button class="nav active" data-page="performance">회원실적&현황</button>
      <button class="nav" data-page="daily">일별정산내역</button>
      <button class="nav" data-page="memberSummary">회원통합정산내역</button>
      <button class="nav" data-page="fills">체결내역</button>
      <button class="nav" data-page="money">입출금내역</button>
      <button class="nav" data-page="deposits">충전관리</button>
      <button class="nav" data-page="withdrawals">출금관리</button>
      <button class="nav" data-page="members">사용자관리</button>
      <button class="nav" data-page="signupCodes">가입코드</button>
      <button class="nav" data-page="notices">공지사항</button>
      <button class="nav" data-page="inquiries">1:1문의</button>
      <button class="nav" data-page="notify">알림발송</button>
      <button class="nav" data-page="audit">관리로그</button>
      <button class="nav" data-page="password">관리자설정</button>
    </aside>
    <main class="main"><div class="crumb">⌂ 메뉴 / <span id="crumbName">회원실적&현황</span></div><section class="page" id="content"></section></main>
  </div>
</div>
<div id="modalRoot"></div>
<script>
const U='https://mzjkvakigwtlibwlslhq.supabase.co',K='sb_publishable_E3h8Gqx-RQqvAxiNXvBhKQ_WZIfGd4t',AUTH=U+'/functions/v1/auth-api',ADMIN=U+'/functions/v1/admin-api';
let token='',data=null,page='performance';
const pageNames={performance:'회원실적&현황',daily:'일별정산내역',memberSummary:'회원통합정산내역',fills:'체결내역',money:'입출금내역',deposits:'충전관리',withdrawals:'출금관리',members:'사용자관리',signupCodes:'가입코드',notices:'공지사항',inquiries:'1:1문의',notify:'알림발송',audit:'관리로그',password:'관리자설정'};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const n=v=>Number(v||0).toLocaleString('ko-KR');
const d=v=>v?new Date(v).toLocaleString('ko-KR',{hour12:false}):'-';
const day=v=>v?String(v).slice(0,10):'-';
const today=()=>new Date().toISOString().slice(0,10);
const daysAgo=x=>{const z=new Date();z.setDate(z.getDate()-x);return z.toISOString().slice(0,10)};
async function post(url,b,auth=false){const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json',apikey:K,Authorization:'Bearer '+(auth?token:K)},body:JSON.stringify(b)});let j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j.error||'request_failed');return j}
async function load(){data=await post(ADMIN,{action:'dashboard'},true);render()}
loginBtn.onclick=async()=>{loginMsg.textContent='';try{const r=await post(AUTH,{action:'login',login_id:loginId.value,password:password.value});if(r.profile?.role!=='admin')throw Error('관리자 권한이 없습니다.');token=r.session.access_token;adminName.textContent=r.profile.login_id;await load();loginScreen.classList.add('hidden');app.classList.remove('hidden')}catch(e){loginMsg.textContent=e.message==='invalid_credentials'?'아이디 또는 비밀번호를 확인하세요.':e.message}};
password.onkeydown=e=>{if(e.key==='Enter')loginBtn.click()};
function logout(){token='';data=null;app.classList.add('hidden');loginScreen.classList.remove('hidden');password.value=''}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');page=b.dataset.page;crumbName.textContent=pageNames[page];render()});
function accountMap(){return Object.fromEntries((data.accounts||[]).map(x=>[x.user_id,x]))}
function profileMap(){return Object.fromEntries((data.profiles||[]).map(x=>[x.id,x]))}
function sum(arr,key){return arr.reduce((s,x)=>s+Number(x[key]||0),0)}
function approvedDeposits(){return data.deposits.filter(x=>x.status==='approved')}
function approvedWithdrawals(){return data.withdrawals.filter(x=>x.status==='approved')}
function within(v,a,b){const x=day(v);return (!a||x>=a)&&(!b||x<=b)}
function title(t){return `<h1 class="title">${t}</h1>`}
function render(){if(!data)return;const c=document.getElementById('content');({performance:renderPerformance,daily:renderDaily,memberSummary:renderMemberSummary,fills:renderFills,money:renderMoney,deposits:renderDeposits,withdrawals:renderWithdrawals,members:renderMembers,signupCodes:renderSignupCodes,notices:renderNotices,inquiries:renderInquiries,notify:renderNotify,audit:renderAudit,password:renderPassword}[page]||renderPerformance)(c)}
function renderPerformance(c){const am=accountMap(),deps=approvedDeposits(),wds=approvedWithdrawals();const totalCash=sum(data.accounts,'cash_balance')+sum(data.accounts,'realized_pnl');const posCount=data.positions.reduce((s,x)=>s+Number(x.qty||0),0);c.innerHTML=title('회원실적&현황')+`<div class="stat-row"><div class="stat"><span>전체회원</span><b>${data.profiles.length}</b></div><div class="stat"><span>활성회원</span><b>${data.profiles.filter(x=>x.status==='active').length}</b></div><div class="stat"><span>전체잔고</span><b>${n(totalCash)}원</b></div><div class="stat"><span>보유포지션</span><b>${n(posCount)}계약</b></div><div class="stat"><span>전체포인트</span><b>${n(sum(data.accounts,'points_balance'))}P</b></div></div><div class="filters"><input id="pfSearch" class="grow" placeholder="회원 아이디/이름 검색"><button class="btn" onclick="filterPerformance()">조회</button><div class="search"><input placeholder="Search..." oninput="filterPerformance(this.value)"></div></div><div class="table-wrap"><table class="grid" id="pfTable"><thead><tr><th>아이디</th><th>이름</th><th>상태</th><th>잔고</th><th>포인트</th><th>누적입금</th><th>누적출금</th><th>보유포지션</th><th>미체결</th><th>체결수</th><th>가입일</th></tr></thead><tbody>${data.profiles.map(p=>{const a=am[p.id]||{};const dep=deps.filter(x=>x.user_id===p.id).reduce((s,x)=>s+Number(x.amount),0);const wd=wds.filter(x=>x.user_id===p.id).reduce((s,x)=>s+Number(x.amount),0);const ps=data.positions.filter(x=>x.user_id===p.id).reduce((s,x)=>s+Number(x.qty),0);const oo=data.orders.filter(x=>x.user_id===p.id&&x.status==='OPEN').length;const fc=data.fills.filter(x=>x.user_id===p.id).length;return `<tr data-q="${esc((p.login_id+' '+(p.display_name||'')).toLowerCase())}"><td class="blue">${esc(p.login_id)}</td><td>${esc(p.display_name||'-')}</td><td><span class="pill ${p.status}">${p.status==='active'?'정상':'정지'}</span></td><td class="num">${n(Number(a.cash_balance||0)+Number(a.realized_pnl||0))}</td><td class="num">${n(a.points_balance)}P</td><td class="num">${n(dep)}</td><td class="num">${n(wd)}</td><td class="num">${n(ps)}</td><td>${oo}</td><td>${fc}</td><td>${day(p.created_at)}</td></tr>`}).join('')}</tbody></table></div>`}
window.filterPerformance=q=>{q=(q??pfSearch?.value??'').toLowerCase();document.querySelectorAll('#pfTable tbody tr').forEach(r=>r.style.display=r.dataset.q.includes(q)?'':'none')}
function renderDaily(c){const start=daysAgo(24),end=today();c.innerHTML=title('총판 일별정산내역')+`<div class="filters"><input id="dailyStart" type="date" value="${start}"><span>~</span><input id="dailyEnd" type="date" value="${end}"><button class="btn" onclick="buildDaily()">조회</button></div><div id="dailyResult"></div>`;buildDaily()}
window.buildDaily=()=>{const a=dailyStart.value,b=dailyEnd.value,rows=[];for(let dt=new Date(b);dt>=new Date(a);dt.setDate(dt.getDate()-1)){const k=dt.toISOString().slice(0,10);const deps=approvedDeposits().filter(x=>day(x.processed_at||x.created_at)===k);const wds=approvedWithdrawals().filter(x=>day(x.processed_at||x.created_at)===k);const fills=data.fills.filter(x=>day(x.filled_at)===k);const pts=data.points.filter(x=>day(x.created_at)===k);rows.push({k,dep:sum(deps,'amount'),wd:sum(wds,'amount'),fills:fills.length,pts:sum(pts,'amount')})}dailyResult.innerHTML=`<div class="warn">* 정산내역은 승인 처리된 입출금과 실제 체결/포인트 변동 데이터를 기준으로 조회됩니다.</div><div class="table-wrap"><table class="grid"><thead><tr><th>일자</th><th>입금</th><th>출금</th><th>순입금</th><th>체결건수</th><th>포인트변동</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.k}</td><td class="num">${n(x.dep)}</td><td class="num">${n(x.wd)}</td><td class="num">${n(x.dep-x.wd)}</td><td>${x.fills}</td><td class="num">${n(x.pts)}P</td></tr>`).join('')}</tbody><tfoot><tr><td>합계</td><td class="num">${n(rows.reduce((s,x)=>s+x.dep,0))}</td><td class="num">${n(rows.reduce((s,x)=>s+x.wd,0))}</td><td class="num">${n(rows.reduce((s,x)=>s+x.dep-x.wd,0))}</td><td>${rows.reduce((s,x)=>s+x.fills,0)}</td><td class="num">${n(rows.reduce((s,x)=>s+x.pts,0))}P</td></tr></tfoot></table></div>`}
function renderMemberSummary(c){c.innerHTML=title('총판회원통합정산내역')+`<div class="filters"><select id="msUser"><option value="">전체회원</option>${data.profiles.map(p=>`<option value="${p.id}">${esc(p.login_id)} · ${esc(p.display_name||'')}</option>`).join('')}</select><input id="msStart" type="date" value="${daysAgo(24)}"><span>~</span><input id="msEnd" type="date" value="${today()}"><button class="btn" onclick="buildMemberSummary()">조회</button></div><div class="warn">* 선택 기간의 입금, 출금, 포인트, 체결 데이터를 회원별로 합산합니다.</div><div id="msResult"></div>`;buildMemberSummary()}
window.buildMemberSummary=()=>{const a=msStart.value,b=msEnd.value,u=msUser.value,am=accountMap();const ps=data.profiles.filter(p=>!u||p.id===u);msResult.innerHTML=`<div class="table-wrap"><table class="grid"><thead><tr><th>아이디</th><th>이름</th><th>상태</th><th>현재잔고</th><th>포인트</th><th>기간입금</th><th>기간출금</th><th>순입금</th><th>체결건수</th><th>보유계약</th></tr></thead><tbody>${ps.map(p=>{const ac=am[p.id]||{};const dep=approvedDeposits().filter(x=>x.user_id===p.id&&within(x.processed_at||x.created_at,a,b)).reduce((s,x)=>s+Number(x.amount),0);const wd=approvedWithdrawals().filter(x=>x.user_id===p.id&&within(x.processed_at||x.created_at,a,b)).reduce((s,x)=>s+Number(x.amount),0);const fills=data.fills.filter(x=>x.user_id===p.id&&within(x.filled_at,a,b)).length;const qty=data.positions.filter(x=>x.user_id===p.id).reduce((s,x)=>s+Number(x.qty),0);return `<tr><td class="blue">${esc(p.login_id)}</td><td>${esc(p.display_name||'-')}</td><td>${p.status}</td><td class="num">${n(Number(ac.cash_balance||0)+Number(ac.realized_pnl||0))}</td><td class="num">${n(ac.points_balance)}P</td><td class="num">${n(dep)}</td><td class="num">${n(wd)}</td><td class="num">${n(dep-wd)}</td><td>${fills}</td><td>${qty}</td></tr>`}).join('')}</tbody></table></div>`}
function renderFills(c){c.innerHTML=title('체결내역 조회')+`<div class="filters"><input id="fillUser" class="grow" placeholder="회원 아이디/이름"><input id="fillStart" type="date" value="${daysAgo(7)}"><input id="fillEnd" type="date" value="${today()}"><button class="btn" onclick="buildFills()">조회</button></div><div id="fillResult"></div>`;buildFills()}
window.buildFills=()=>{const q=(fillUser.value||'').toLowerCase(),a=fillStart.value,b=fillEnd.value;const rows=data.fills.filter(x=>within(x.filled_at,a,b)&&(!q||((x.profiles?.login_id||'')+' '+(x.profiles?.display_name||'')).toLowerCase().includes(q)));fillResult.innerHTML=`<div class="table-wrap"><table class="grid"><thead><tr><th>체결시간</th><th>아이디</th><th>이름</th><th>종목</th><th>구분</th><th>수량</th><th>체결가</th><th>체결유형</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${d(x.filled_at)}</td><td class="blue">${esc(x.profiles?.login_id)}</td><td>${esc(x.profiles?.display_name||'')}</td><td>${esc(x.symbol)}</td><td>${x.side}</td><td>${x.qty}</td><td class="num">${esc(x.fill_price)}</td><td>${esc(x.fill_type)}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">조회결과가 없습니다.</td></tr>'}</tbody></table></div>`}
function renderMoney(c){c.innerHTML=title('입출금 내역')+`<div class="filters"><select id="moneyType"><option value="ALL">전체</option><option value="BANK">계좌입금</option><option value="CRYPTO">코인입금</option><option value="WD">출금</option></select><input id="moneyUser" class="grow" placeholder="회원 아이디/이름"><input id="moneyStart" type="date" value="${daysAgo(30)}"><input id="moneyEnd" type="date" value="${today()}"><select id="moneyStatus"><option value="">전체상태</option><option>pending</option><option>assigned</option><option>confirm_requested</option><option>approved</option><option>rejected</option></select><button class="btn" onclick="buildMoney()">조회</button></div><div id="moneyResult"></div>`;buildMoney()}
window.buildMoney=()=>{const t=moneyType.value,q=(moneyUser.value||'').toLowerCase(),a=moneyStart.value,b=moneyEnd.value,s=moneyStatus.value;let rows=[];if(t==='ALL'||t==='BANK'||t==='CRYPTO')rows.push(...data.deposits.filter(x=>(t==='ALL'||x.request_type===t)).map(x=>({...x,kind:x.request_type==='CRYPTO'?'코인입금':'계좌입금'})));if(t==='ALL'||t==='WD')rows.push(...data.withdrawals.map(x=>({...x,kind:'출금'})));rows=rows.filter(x=>within(x.created_at,a,b)&&(!s||x.status===s)&&(!q||((x.profiles?.login_id||'')+' '+(x.profiles?.display_name||'')).toLowerCase().includes(q))).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));moneyResult.innerHTML=`<div class="table-wrap"><table class="grid"><thead><tr><th>신청시간</th><th>회원</th><th>구분</th><th>금액</th><th>상태</th><th>처리시간</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${d(x.created_at)}</td><td class="blue">${esc(x.profiles?.login_id)}</td><td>${x.kind}</td><td class="num">${n(x.amount)}원</td><td>${x.status}</td><td>${d(x.processed_at||x.approved_at)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">조회결과가 없습니다.</td></tr>'}</tbody></table></div>`}
function renderDeposits(c){c.innerHTML=title('충전관리')+`<div class="filters"><input id="depQ" class="grow" placeholder="회원 검색"><select id="depStatus"><option value="">전체상태</option><option>pending</option><option>assigned</option><option>confirm_requested</option><option>approved</option><option>rejected</option></select><button class="btn" onclick="filterDepositRows()">조회</button></div><div class="table-wrap"><table class="grid" id="depTable"><thead><tr><th>ID</th><th>회원</th><th>구분</th><th>금액</th><th>상태</th><th>신청시간</th><th>안내/처리</th></tr></thead><tbody>${data.deposits.map(x=>`<tr data-q="${esc(((x.profiles?.login_id||'')+' '+(x.profiles?.display_name||'')).toLowerCase())}" data-status="${x.status}"><td>${x.id}</td><td class="blue">${esc(x.profiles?.login_id)}</td><td class="${x.request_type==='CRYPTO'?'tag-crypto':'tag-bank'}">${x.request_type==='CRYPTO'?'코인':'계좌'}</td><td class="num">${n(x.amount)}원</td><td>${x.status}</td><td>${d(x.created_at)}</td><td><div class="actions">${x.request_type==='CRYPTO'?`<button class="btn small gray" onclick="openCrypto(${x.id})">입금정보</button>`:`<button class="btn small gray" onclick="openBank(${x.id})">계좌안내</button>`}<button class="btn small green" onclick="approveDeposit(${x.id})">승인</button><button class="btn small red" onclick="rejectDeposit(${x.id})">반려</button></div></td></tr>`).join('')}</tbody></table></div>`}
window.filterDepositRows=()=>{const q=(depQ.value||'').toLowerCase(),s=depStatus.value;document.querySelectorAll('#depTable tbody tr').forEach(r=>r.style.display=((!q||r.dataset.q.includes(q))&&(!s||r.dataset.status===s))?'':'none')}
function renderWithdrawals(c){c.innerHTML=title('출금관리')+`<div class="filters"><input id="wdQ" class="grow" placeholder="회원 검색"><select id="wdStatus"><option value="">전체상태</option><option>pending</option><option>approved</option><option>rejected</option></select><button class="btn" onclick="filterWdRows()">조회</button></div><div class="table-wrap"><table class="grid" id="wdTable"><thead><tr><th>ID</th><th>회원</th><th>금액</th><th>은행</th><th>계좌번호</th><th>예금주</th><th>상태</th><th>신청시간</th><th>처리</th></tr></thead><tbody>${data.withdrawals.map(x=>`<tr data-q="${esc(((x.profiles?.login_id||'')+' '+(x.profiles?.display_name||'')).toLowerCase())}" data-status="${x.status}"><td>${x.id}</td><td class="blue">${esc(x.profiles?.login_id)}</td><td class="num">${n(x.amount)}원</td><td>${esc(x.bank_name)}</td><td>${esc(x.bank_account)}</td><td>${esc(x.account_holder)}</td><td>${x.status}</td><td>${d(x.created_at)}</td><td><div class="actions"><button class="btn small green" onclick="approveWithdrawal(${x.id})">승인</button><button class="btn small red" onclick="rejectWithdrawal(${x.id})">반려</button></div></td></tr>`).join('')}</tbody></table></div>`}
window.filterWdRows=()=>{const q=(wdQ.value||'').toLowerCase(),s=wdStatus.value;document.querySelectorAll('#wdTable tbody tr').forEach(r=>r.style.display=((!q||r.dataset.q.includes(q))&&(!s||r.dataset.status===s))?'':'none')}
function renderMembers(c){const am=accountMap();c.innerHTML=title('회원 관리')+`<div class="filters"><button class="btn green" onclick="openCreateMember()">+ 계정생성</button><input id="memberQ" class="grow" placeholder="아이디/이름/전화/이메일"><button class="btn" onclick="filterMemberRows()">조회</button></div><div class="table-wrap"><table class="grid" id="memberTable"><thead><tr><th>관리기능</th><th>상태</th><th>아이디</th><th>이름</th><th>핸드폰</th><th>메일주소</th><th>출생년월일</th><th>은행명</th><th>계좌번호</th><th>예금주</th><th>잔고</th><th>포인트</th><th>가입일</th></tr></thead><tbody>${data.profiles.map(p=>{const a=am[p.id]||{};const q=(p.login_id+' '+(p.display_name||'')+' '+(p.phone||'')+' '+(p.email||'')).toLowerCase();return `<tr data-q="${esc(q)}"><td><div class="actions"><button class="btn small" onclick="openPoints('${p.id}','${esc(p.login_id)}')">포인트</button><button class="btn small gray" onclick="resetPassword('${p.id}','${esc(p.login_id)}')">비번초기화</button><button class="btn small ${p.status==='active'?'red':'green'}" onclick="setStatus('${p.id}','${p.status==='active'?'suspended':'active'}')">${p.status==='active'?'이용정지':'정지해제'}</button></div></td><td><span class="pill ${p.status}">${p.status==='active'?'정상':'정지'}</span></td><td class="blue">${esc(p.login_id)}</td><td>${esc(p.display_name||'-')}</td><td>${esc(p.phone||'-')}</td><td>${esc(p.email||'-')}</td><td>${esc(p.birth_date||'-')}</td><td>${esc(p.bank_name||'-')}</td><td>${esc(p.bank_account||'-')}</td><td>${esc(p.account_holder||'-')}</td><td class="num">${n(Number(a.cash_balance||0)+Number(a.realized_pnl||0))}</td><td class="num">${n(a.points_balance)}P</td><td>${day(p.created_at)}</td></tr>`}).join('')}</tbody></table></div>`}
window.filterMemberRows=()=>{const q=(memberQ.value||'').toLowerCase();document.querySelectorAll('#memberTable tbody tr').forEach(r=>r.style.display=r.dataset.q.includes(q)?'':'none')}
function renderSignupCodes(c){c.innerHTML=title('가입코드 관리')+`<div class="card"><h3>가입코드 생성/수정</h3><div class="form"><input id="scCode" placeholder="가입코드"><input id="scMax" type="number" placeholder="최대 사용횟수 (비우면 무제한)"><input id="scExp" type="datetime-local"><select id="scActive"><option value="1">활성</option><option value="0">비활성</option></select></div><div class="form-actions"><button class="btn" onclick="saveSignupCode()">저장</button></div></div><div class="table-wrap"><table class="grid"><thead><tr><th>코드</th><th>상태</th><th>사용횟수</th><th>최대횟수</th><th>만료일</th><th>관리</th></tr></thead><tbody>${data.signup_codes.map(x=>`<tr><td class="blue">${esc(x.code)}</td><td>${x.active?'활성':'중지'}</td><td>${x.used_count}</td><td>${x.max_uses??'무제한'}</td><td>${d(x.expires_at)}</td><td><button class="btn small gray" onclick='editSignupCode(${JSON.stringify(x)})'>수정</button> <button class="btn small red" onclick="deleteSignupCode('${esc(x.code)}')">삭제</button></td></tr>`).join('')}</tbody></table></div>`}
function renderNotices(c){c.innerHTML=title('공지사항')+`<div class="card"><h3>공지사항 작성/수정</h3><div class="form"><input id="noticeId" placeholder="수정 시 ID" readonly><input id="noticeDate" type="date" value="${today()}"><input id="noticeTitle" class="full" placeholder="제목"><textarea id="noticeBody" class="full" placeholder="내용"></textarea></div><div class="form-actions"><button class="btn" onclick="saveNotice()">저장</button><button class="btn gray" onclick="clearNotice()">초기화</button></div></div><div class="table-wrap"><table class="grid"><thead><tr><th>ID</th><th>작성일</th><th>제목</th><th>상태</th><th>관리</th></tr></thead><tbody>${data.notices.map(x=>`<tr><td>${x.id}</td><td>${esc(x.display_date)}</td><td class="left">${esc(x.title)}</td><td>${x.active?'노출':'숨김'}</td><td><button class="btn small gray" onclick='editNotice(${JSON.stringify(x)})'>수정</button> <button class="btn small red" onclick="deleteNotice(${x.id})">삭제</button></td></tr>`).join('')}</tbody></table></div>`}
function renderInquiries(c){c.innerHTML=title('1:1문의')+`<div class="table-wrap"><table class="grid"><thead><tr><th>ID</th><th>회원</th><th>제목</th><th>상태</th><th>접수일</th><th>답변</th></tr></thead><tbody>${data.inquiries.map(x=>`<tr><td>${x.id}</td><td class="blue">${esc(x.profiles?.login_id)}</td><td class="left">${esc(x.subject)}</td><td>${x.status}</td><td>${d(x.created_at)}</td><td><button class="btn small" onclick='openInquiry(${JSON.stringify(x)})'>보기/답변</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">문의가 없습니다.</td></tr>'}</tbody></table></div>`}
function renderNotify(c){c.innerHTML=title('회원 알림 발송')+`<div class="card"><div class="form"><select id="notifyUser"><option value="">회원 선택</option>${data.profiles.filter(x=>x.role!=='admin').map(x=>`<option value="${x.id}">${esc(x.login_id)} · ${esc(x.display_name||'')}</option>`).join('')}</select><input id="notifyTitle" placeholder="제목"><textarea id="notifyBody" class="full" placeholder="알림 내용"></textarea></div><div class="form-actions"><button class="btn" onclick="sendNotification()">발송</button></div></div>`}
function renderAudit(c){c.innerHTML=title('관리로그')+`<div class="table-wrap"><table class="grid"><thead><tr><th>시간</th><th>관리자ID</th><th>작업</th><th>대상</th><th>상세</th></tr></thead><tbody>${data.audit_logs.map(x=>`<tr><td>${d(x.created_at)}</td><td>${esc(x.actor_user_id||'-')}</td><td class="blue">${esc(x.action)}</td><td>${esc(x.entity_type)} ${esc(x.entity_id||'')}</td><td class="left">${esc(JSON.stringify(x.payload||{}))}</td></tr>`).join('')}</tbody></table></div>`}
function renderPassword(c){c.innerHTML=title('관리자 설정')+`<div class="card pwbox"><h3>비밀번호 변경</h3><input id="curPw" type="password" placeholder="현재 비밀번호"><input id="newPw" type="password" placeholder="새 비밀번호 (8자 이상)"><input id="newPw2" type="password" placeholder="새 비밀번호 확인"><button class="btn" onclick="changePassword()">비밀번호 변경</button><div id="pwMsg" class="hint"></div></div>`}
async function act(a,p,refresh=true){try{const r=await post(ADMIN,{action:a,...p},true);if(refresh)await load();return r}catch(e){alert(e.message);throw e}}
function modal(html){modalRoot.innerHTML=`<div class="modal-mask" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}window.closeModal=()=>modalRoot.innerHTML='';
window.openCreateMember=()=>modal(`<button class="btn small gray modal-close" onclick="closeModal()">닫기</button><h3>계정생성</h3><div class="form"><input id="mcId" placeholder="아이디"><input id="mcPw" type="password" placeholder="비밀번호 (8자 이상)"><input id="mcName" placeholder="이름"><input id="mcPhone" placeholder="핸드폰번호"><input id="mcEmail" placeholder="이메일 (비우면 자동생성)"><input id="mcBirth" type="date"><select id="mcBank"><option value="">은행선택</option>${['국민은행','신한은행','우리은행','하나은행','농협은행','기업은행','SC제일은행','카카오뱅크','케이뱅크','토스뱅크','부산은행','경남은행','광주은행','전북은행','제주은행','수협은행','새마을금고','신협','우체국','산업은행','저축은행'].map(x=>`<option>${x}</option>`).join('')}</select><input id="mcAccount" placeholder="계좌번호"><input id="mcHolder" placeholder="예금주"></div><div class="form-actions"><button class="btn green" onclick="createMember()">생성</button></div>`)
window.createMember=async()=>{await act('member_create',{login_id:mcId.value,password:mcPw.value,display_name:mcName.value,phone:mcPhone.value,email:mcEmail.value,birth_date:mcBirth.value,bank_name:mcBank.value,bank_account:mcAccount.value,account_holder:mcHolder.value});closeModal();alert('계정이 생성되었습니다.')}
window.openPoints=(id,login)=>{const ac=accountMap()[id]||{};modal(`<button class="btn small gray modal-close" onclick="closeModal()">닫기</button><h3>${esc(login)} 포인트 관리</h3><p>현재 포인트: <b>${n(ac.points_balance)}P</b></p><div class="form"><select id="ptType"><option value="give">지급</option><option value="take">수거</option></select><input id="ptAmount" type="number" min="1" placeholder="포인트"><input id="ptReason" class="full" placeholder="사유"></div><div class="form-actions"><button class="btn" onclick="adjustPoints('${id}')">적용</button></div><h3 style="margin-top:18px">최근 변동내역</h3><div class="table-wrap"><table class="grid"><tr><th>시간</th><th>변동</th><th>잔액</th><th>사유</th></tr>${data.points.filter(x=>x.user_id===id).slice(0,20).map(x=>`<tr><td>${d(x.created_at)}</td><td class="num ${Number(x.amount)>=0?'green':'redtxt'}">${Number(x.amount)>=0?'+':''}${n(x.amount)}P</td><td class="num">${n(x.balance_after)}P</td><td>${esc(x.reason||'')}</td></tr>`).join('')}</table></div>`)}
window.adjustPoints=async id=>{const v=Math.abs(Math.trunc(Number(ptAmount.value||0)));if(!v)return alert('포인트를 입력하세요.');await act('points_adjust',{user_id:id,amount:ptType.value==='take'?-v:v,reason:ptReason.value});closeModal();alert('포인트가 반영되었습니다.')}
window.setStatus=async(id,status)=>{if(!confirm(status==='suspended'?'이 회원을 이용정지할까요?':'이 회원의 정지를 해제할까요?'))return;await act('member_status',{user_id:id,status})}
window.resetPassword=async(id,login)=>{const p=prompt(`${login} 계정의 새 임시 비밀번호를 입력하세요. (8자 이상)`);if(!p)return;if(p.length<8)return alert('8자 이상 입력하세요.');await act('member_reset_password',{user_id:id,new_password:p},false);alert('비밀번호가 변경되었습니다.')}
window.openBank=id=>{const x=data.deposits.find(v=>v.id===id);modal(`<button class="btn small gray modal-close" onclick="closeModal()">닫기</button><h3>입금 계좌 안내 #${id}</h3><div class="form"><input id="abank" value="${esc(x?.assigned_bank_name||'')}" placeholder="은행"><input id="aacct" value="${esc(x?.assigned_bank_account||'')}" placeholder="계좌번호"><input id="aholder" value="${esc(x?.assigned_account_holder||'')}" placeholder="예금주"></div><div class="form-actions"><button class="btn" onclick="assignBank(${id})">안내저장</button></div>`)}
window.assignBank=async id=>{await act('assign_bank',{id,bank_name:abank.value,bank_account:aacct.value,account_holder:aholder.value});closeModal()}
window.openCrypto=id=>{const x=data.deposits.find(v=>v.id===id);modal(`<button class="btn small gray modal-close" onclick="closeModal()">닫기</button><h3>코인 입금 안내 #${id}</h3><div class="form"><input id="asset" value="${esc(x?.crypto_asset||'USDT')}" placeholder="코인"><input id="network" value="${esc(x?.crypto_network||'TRC20')}" placeholder="네트워크"><input id="wallet" class="full" value="${esc(x?.assigned_wallet_address||'')}" placeholder="지갑주소"><input id="cryptoQty" type="number" step="any" value="${esc(x?.assigned_crypto_amount||'')}" placeholder="입금수량"></div><div class="form-actions"><button class="btn" onclick="assignCrypto(${id})">안내저장</button></div>`)}
window.assignCrypto=async id=>{await act('assign_crypto',{id,asset:asset.value,network:network.value,wallet_address:wallet.value,crypto_amount:Number(cryptoQty.value)});closeModal()}
window.approveDeposit=id=>confirm('최종 승인 후 잔고에 반영됩니다. 승인할까요?')&&act('approve_deposit',{id});window.rejectDeposit=id=>{const r=prompt('반려사유를 입력하세요.')||'';if(r!==null)act('reject_deposit',{id,admin_note:r})};window.approveWithdrawal=id=>confirm('출금 승인을 처리할까요?')&&act('approve_withdrawal',{id});window.rejectWithdrawal=id=>{const r=prompt('반려사유를 입력하세요.')||'';act('reject_withdrawal',{id,admin_note:r})}
window.editNotice=x=>{noticeId.value=x.id;noticeDate.value=x.display_date;noticeTitle.value=x.title;noticeBody.value=x.body;window.scrollTo(0,0)};window.clearNotice=()=>{noticeId.value='';noticeDate.value=today();noticeTitle.value='';noticeBody.value=''};window.saveNotice=()=>act('notice_save',{id:Number(noticeId.value||0),display_date:noticeDate.value,title:noticeTitle.value,body:noticeBody.value});window.deleteNotice=id=>confirm('공지사항을 삭제할까요?')&&act('notice_delete',{id});
window.openInquiry=x=>modal(`<button class="btn small gray modal-close" onclick="closeModal()">닫기</button><h3>${esc(x.profiles?.login_id)} · ${esc(x.subject)}</h3><div class="card">${esc(x.body).replace(/\n/g,'<br>')}</div><textarea id="inqAnswer" style="width:100%;height:150px;border:1px solid #bbb;padding:8px" placeholder="답변">${esc(x.answer||'')}</textarea><div class="form-actions"><button class="btn" onclick="answerInquiry(${x.id})">답변저장</button></div>`);window.answerInquiry=async id=>{await act('answer_inquiry',{id,answer:inqAnswer.value});closeModal()};window.sendNotification=()=>act('send_notification',{user_id:notifyUser.value,title:notifyTitle.value,body:notifyBody.value});
window.editSignupCode=x=>{scCode.value=x.code;scMax.value=x.max_uses??'';scExp.value=x.expires_at?String(x.expires_at).slice(0,16):'';scActive.value=x.active?'1':'0'};window.saveSignupCode=()=>act('signup_code_save',{code:scCode.value,max_uses:scMax.value,expires_at:scExp.value?new Date(scExp.value).toISOString():null,active:scActive.value==='1'});window.deleteSignupCode=code=>confirm('가입코드를 삭제할까요?')&&act('signup_code_delete',{code});
window.changePassword=async()=>{if(!curPw.value||!newPw.value||!newPw2.value)return pwMsg.textContent='비밀번호를 모두 입력하세요.';if(newPw.value!==newPw2.value)return pwMsg.textContent='새 비밀번호 확인이 일치하지 않습니다.';if(newPw.value.length<8)return pwMsg.textContent='새 비밀번호는 8자 이상 입력하세요.';try{await post(AUTH,{action:'change_password',current_password:curPw.value,new_password:newPw.value},true);pwMsg.textContent='비밀번호가 변경되었습니다.';curPw.value=newPw.value=newPw2.value=''}catch(e){pwMsg.textContent=e.message==='invalid_current_password'?'현재 비밀번호가 일치하지 않습니다.':e.message}}
</script>
</body></html>
