<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VELTRO Admin</title><style>body{font-family:Arial,'Malgun Gothic',sans-serif;margin:0;background:#f3f5f7;color:#111}header{height:54px;background:#0f2f56;color:#fff;display:flex;align-items:center;padding:0 20px;font-weight:700}.wrap{padding:18px;max-width:1300px;margin:auto}.card{background:#fff;border:1px solid #c9d1d8;margin-bottom:14px;padding:14px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input,select,textarea,button{font:inherit}input,select,textarea{border:1px solid #aab3ba;padding:7px}button{border:1px solid #1d6e9c;background:#2a7fad;color:#fff;padding:7px 12px;cursor:pointer}button.gray{background:#eee;color:#222;border-color:#aaa}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #d6dbe0;padding:6px;vertical-align:top}th{background:#eef1f4}.hidden{display:none}.login{max-width:420px;margin:80px auto}.login input{width:100%;box-sizing:border-box;margin-bottom:8px}.tabs{display:flex;gap:4px;margin-bottom:12px}.tabs button.active{background:#174f78}.muted{color:#69747d;font-size:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}textarea{width:100%;min-height:90px;box-sizing:border-box}</style></head><body><header>VELTRO ADMIN</header><div class="wrap"><section id="loginBox" class="card login"><h3>관리자 로그인</h3><input id="loginId" placeholder="아이디"><input id="password" type="password" placeholder="비밀번호"><button id="loginBtn">로그인</button><div id="loginMsg" class="muted"></div></section><section id="adminBox" class="hidden"><div class="tabs"><button data-tab="deposits" class="active">입금관리</button><button data-tab="withdrawals">출금관리</button><button data-tab="notices">공지사항</button><button data-tab="inquiries">1:1문의</button><button data-tab="notify">알림발송</button></div><div id="content"></div></section></div><script>const U='https://mzjkvakigwtlibwlslhq.supabase.co',K='sb_publishable_E3h8Gqx-RQqvAxiNXvBhKQ_WZIfGd4t',AUTH=U+'/functions/v1/auth-api',ADMIN=U+'/functions/v1/admin-api';let token='',data=null,tab='deposits';async function post(url,b,auth=false){const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json',apikey:K,Authorization:'Bearer '+(auth?token:K)},body:JSON.stringify(b)});const j=await r.json();if(!r.ok)throw Error(j.error||'request_failed');return j}async function load(){data=await post(ADMIN,{action:'dashboard'},true);render()}document.getElementById('loginBtn').onclick=async()=>{try{const r=await post(AUTH,{action:'login',login_id:loginId.value,password:password.value});token=r.session.access_token;await load();loginBox.classList.add('hidden');adminBox.classList.remove('hidden')}catch(e){loginMsg.textContent=e.message}};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;render()});function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){if(!data)return;const c=document.getElementById('content');if(tab==='deposits'){c.innerHTML='<div class="card"><h3>입금관리</h3><table><tr><th>ID</th><th>회원</th><th>구분</th><th>금액</th><th>상태</th><th>안내/처리</th></tr>'+data.deposits.map(x=>`<tr><td>${x.id}</td><td>${esc(x.profiles?.login_id)}</td><td>${x.request_type}</td><td>${Number(x.amount).toLocaleString()}원</td><td>${x.status}</td><td>${x.request_type==='CRYPTO'?`<input id="a${x.id}" placeholder="코인" value="${esc(x.crypto_asset||'USDT')}"><input id="n${x.id}" placeholder="네트워크" value="${esc(x.crypto_network||'TRC20')}"><input id="w${x.id}" placeholder="지갑주소" value="${esc(x.assigned_wallet_address||'')}"><input id="q${x.id}" placeholder="수량" value="${esc(x.assigned_crypto_amount||'')}"><button onclick="assignCrypto(${x.id})">안내저장</button>`:`<input id="b${x.id}" placeholder="은행" value="${esc(x.assigned_bank_name||'')}"><input id="ac${x.id}" placeholder="계좌번호" value="${esc(x.assigned_bank_account||'')}"><input id="h${x.id}" placeholder="예금주" value="${esc(x.assigned_account_holder||'')}"><button onclick="assignBank(${x.id})">안내저장</button>`}<button onclick="approveDeposit(${x.id})">승인</button><button class="gray" onclick="rejectDeposit(${x.id})">반려</button></td></tr>`).join('')+'</table></div>'}else if(tab==='withdrawals'){c.innerHTML='<div class="card"><h3>출금관리</h3><table><tr><th>ID</th><th>회원</th><th>금액</th><th>계좌</th><th>상태</th><th>처리</th></tr>'+data.withdrawals.map(x=>`<tr><td>${x.id}</td><td>${esc(x.profiles?.login_id)}</td><td>${Number(x.amount).toLocaleString()}원</td><td>${esc(x.bank_name)} ${esc(x.bank_account)} ${esc(x.account_holder)}</td><td>${x.status}</td><td><button onclick="approveWithdrawal(${x.id})">승인</button><button class="gray" onclick="rejectWithdrawal(${x.id})">반려</button></td></tr>`).join('')+'</table></div>'}else if(tab==='notices'){c.innerHTML='<div class="card"><h3>공지사항 작성/수정</h3><div class="grid2"><div><input id="noticeId" placeholder="수정시 ID"><input id="noticeDate" type="date"><input id="noticeTitle" placeholder="제목" style="width:100%"></div><textarea id="noticeBody" placeholder="내용"></textarea></div><button onclick="saveNotice()">저장</button></div><div class="card"><table><tr><th>ID</th><th>작성일</th><th>제목</th><th>관리</th></tr>'+data.notices.map(x=>`<tr><td>${x.id}</td><td>${esc(x.display_date)}</td><td>${esc(x.title)}</td><td><button onclick='editNotice(${JSON.stringify(x)})'>수정</button><button class="gray" onclick="deleteNotice(${x.id})">삭제</button></td></tr>`).join('')+'</table></div>'}else if(tab==='inquiries'){c.innerHTML='<div class="card"><h3>1:1문의</h3>'+data.inquiries.map(x=>`<div class="card"><b>${esc(x.profiles?.login_id)} · ${esc(x.subject)}</b><p>${esc(x.body)}</p><textarea id="ans${x.id}" placeholder="답변">${esc(x.answer||'')}</textarea><button onclick="answerInquiry(${x.id})">답변저장</button></div>`).join('')+'</div>'}else{c.innerHTML='<div class="card"><h3>회원 알림 발송</h3><select id="notifyUser">'+data.profiles.map(x=>`<option value="${x.id}">${esc(x.login_id)}</option>`).join('')+'</select><input id="notifyTitle" placeholder="제목"><textarea id="notifyBody" placeholder="알림내용"></textarea><button onclick="sendNotification()">발송</button></div>'}}async function act(a,p){await post(ADMIN,{action:a,...p},true);await load()}window.assignBank=id=>act('assign_bank',{id,bank_name:document.getElementById('b'+id).value,bank_account:document.getElementById('ac'+id).value,account_holder:document.getElementById('h'+id).value});window.assignCrypto=id=>act('assign_crypto',{id,asset:document.getElementById('a'+id).value,network:document.getElementById('n'+id).value,wallet_address:document.getElementById('w'+id).value,crypto_amount:Number(document.getElementById('q'+id).value)});window.approveDeposit=id=>act('approve_deposit',{id});window.rejectDeposit=id=>act('reject_deposit',{id,admin_note:prompt('반려사유')||''});window.approveWithdrawal=id=>act('approve_withdrawal',{id});window.rejectWithdrawal=id=>act('reject_withdrawal',{id,admin_note:prompt('반려사유')||''});window.saveNotice=()=>act('notice_save',{id:Number(noticeId.value||0),display_date:noticeDate.value,title:noticeTitle.value,body:noticeBody.value});window.editNotice=x=>{noticeId.value=x.id;noticeDate.value=x.display_date;noticeTitle.value=x.title;noticeBody.value=x.body;window.scrollTo(0,0)};window.deleteNotice=id=>confirm('삭제할까요?')&&act('notice_delete',{id});window.answerInquiry=id=>act('answer_inquiry',{id,answer:document.getElementById('ans'+id).value});window.sendNotification=()=>act('send_notification',{user_id:notifyUser.value,title:notifyTitle.value,body:notifyBody.value});</script></body></html>
