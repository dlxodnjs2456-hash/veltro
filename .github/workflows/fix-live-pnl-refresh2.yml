name: Apply live price PnL refresh
on:
  push:
    paths:
      - '.github/workflows/fix-live-pnl-refresh2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch WTS live refresh
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='async function startTimers()'
          helper="""function refreshLiveTrade(){
            if(page!=='trade') return;
            const price=pf(lp());
            document.querySelectorAll('.last').forEach(el=>el.textContent=price);
            document.querySelectorAll('.book').forEach(el=>el.innerHTML=ladder());
            document.querySelectorAll('.bottom').forEach(el=>el.innerHTML=positions());
            if(isMobile()&&tab==='positions'){const mm=document.querySelector('#mMain');if(mm)mm.innerHTML=mobile();}
            bind();
          }
          """
          if 'function refreshLiveTrade()' not in s and marker in s:
              s=s.replace(marker,helper+marker)
          old="if(page==='trade'&&tab==='quote'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))renderAll()"
          if old in s:
              s=s.replace(old,"if(page==='trade')refreshLiveTrade()")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "VELTRO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix live price and PnL refresh"
          git push
