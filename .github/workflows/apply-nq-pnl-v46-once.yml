name: Apply NQ PnL benchmark v1.0.46 once

on:
  push:
    paths:
      - '.github/workflows/apply-nq-pnl-v46-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply NQ benchmark to WTS/MTS and HTS release workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # WTS/MTS share index.html and the INS table.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="{symbol:'NQU26',code:'NQ',name:'E-mini Nasdaq100',exchange:'CME',month:'202609',tick:.25,tickValue:6290}"
          new="{symbol:'NQU26',code:'NQ',name:'E-mini Nasdaq100',exchange:'CME',month:'202609',tick:.25,tickValue:6847.5}"
          if old not in s:
              raise SystemExit('WTS/MTS NQ tickValue anchor missing; refusing broad replacement')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Ensure the HTS build applies the narrow NQ-only patch and watches it.
          w=Path('.github/workflows/build-veltro-hts.yml')
          t=w.read_text(encoding='utf-8')
          path_anchor="      - 'desktop/patch/bbo_v44.py'\n"
          if "desktop/patch/nq_pnl_v46.py" not in t:
              if path_anchor not in t: raise SystemExit('HTS workflow path anchor missing')
              t=t.replace(path_anchor,path_anchor+"      - 'desktop/patch/nq_pnl_v46.py'\n",1)
          step_anchor="      - name: Use real Databento BBO without synthetic price offsets\n        shell: pwsh\n        run: python desktop/patch/bbo_v44.py\n"
          step="\n      - name: Apply NQ PnL benchmark from supplied reference\n        shell: pwsh\n        run: python desktop/patch/nq_pnl_v46.py\n"
          if 'Apply NQ PnL benchmark from supplied reference' not in t:
              if step_anchor not in t: raise SystemExit('HTS workflow step anchor missing')
              t=t.replace(step_anchor,step_anchor+step,1)
          w.write_text(t,encoding='utf-8')

          Path('desktop/RELEASE').write_text('1.0.46\n',encoding='utf-8')

          # Exact regression guard from supplied reference.
          pnl=(29220.75-29225.00)/0.25*6847.5*10
          if round(pnl)!=-1164075:
              raise SystemExit(f'benchmark mismatch: {pnl}')
          print('benchmark verified:', round(pnl))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html desktop/RELEASE .github/workflows/build-veltro-hts.yml
          git commit -m 'Apply NQ PnL benchmark across HTS WTS MTS' || exit 0
          git push
