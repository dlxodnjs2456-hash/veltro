name: Apply unified market data v8 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-unified-market-v8.yml'

permissions:
  contents: write

jobs:
  unify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unify WTS MTS market data endpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          files=['wts-hotfix-v2.js','wts-chart-v3.js','wts-runtime-v6.js']
          old='https://mzjkvakigwtlibwlslhq.supabase.co/functions/v1/wts-market-feed'
          new='https://mzjkvakigwtlibwlslhq.supabase.co/functions/v1/market-data-api'
          for fn in files:
              p=Path(fn); s=p.read_text(encoding='utf-8')
              if old in s: s=s.replace(old,new)
              if fn=='wts-chart-v3.js':
                  s=s.replace('과거봉 Databento · 현재가 Yahoo 지연시세','과거봉 Databento · 현재가 Databento Live 우선')
                  s=s.replace("setConn(age>30000?'시세 지연':'연결됨 · 지연시세',age>30000)","setConn(age>5000?'Databento 폴백':'Databento Live',age>5000)")
                  s=s.replace("setConn('연결됨 · 지연시세')","setConn('Databento 연결')")
                  s=s.replace('현재가 Yahoo 지연시세','현재가 Databento Live 우선')
              p.write_text(s,encoding='utf-8')
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('/wts-hotfix-v2.js?v=20260901-2','/wts-hotfix-v2.js?v=20260901-3')
          s=s.replace('/wts-chart-v3.js?v=20260901-2','/wts-chart-v3.js?v=20260901-3')
          s=s.replace('/wts-runtime-v6.js?v=20260901-2','/wts-runtime-v6.js?v=20260901-3')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify unified feed and protected features
        run: |
          python - <<'PY'
          from pathlib import Path
          for fn in ['wts-hotfix-v2.js','wts-chart-v3.js','wts-runtime-v6.js']:
              s=Path(fn).read_text(encoding='utf-8')
              assert 'functions/v1/market-data-api' in s, fn
              assert 'functions/v1/wts-market-feed' not in s, fn
          s=Path('index.html').read_text(encoding='utf-8')
          for marker in ['입출금','회원정보','submit_order','close_position','confirm_requested']:
              assert marker in s, marker
          PY
      - name: Commit unified feed patch
        run: |
          if git diff --quiet -- wts-hotfix-v2.js wts-chart-v3.js wts-runtime-v6.js index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wts-hotfix-v2.js wts-chart-v3.js wts-runtime-v6.js index.html
          git commit -m 'Use unified Databento market feed across WTS MTS'
          git push
