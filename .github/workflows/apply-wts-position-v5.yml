name: Apply WTS MTS position quotes v5 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-wts-position-v5.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load multi-symbol position quote patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/wts-position-quotes-v5.js?v=20260901-1"></script>'
          if tag not in s:
              if '</body>' not in s: raise SystemExit('body anchor missing')
              s=s.replace('</body>',tag+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit index patch
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load WTS MTS multi-symbol position quotes v5'
          git push
