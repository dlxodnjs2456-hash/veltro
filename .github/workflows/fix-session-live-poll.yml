name: Fix WTS session and live polling
on:
  push:
    paths:
      - '.github/workflows/fix-session-live-poll.yml'
      - '.github/scripts/patch_wts_session.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch WTS
        run: python .github/scripts/patch_wts_session.py
      - name: Commit patch
        run: |
          git config user.name "VELTRO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix WTS live polling and persistent session"
          git push
