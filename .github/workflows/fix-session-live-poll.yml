jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch WTS
        run: |
          echo ' nKycvYXV0aC92MS90b2tlbj9ncmFudF90eXBlPXJlZnJlc2hfdG9rZW4nLHttZXRob2Q6J1BPU1QnLGhlYWRlcnM6eydjb250ZW50LXR5cGUnOidhcHBsaWNhdGlvbi9qc29uJyxhcGlrZXk6S30sYm9keTpKU09OLnN0cmluZ2lmeSh7cmVmcmVzaF90b2tlbjpyZWZyZXNoVG9rZW59KX0pOwogICAgY29uc3Qga   aWYgImNvbnN0IFNFU1NJT05fS0VZPSd2ZWx0cm9fd3RzX3Nlc3Npb25fdjEnOyIgbm90IGluIHMgYW5kIG1hcmtlciBpbiBzOgogICAgcz1zLnJlcGxhY2UobWFya2VyLGhlbHBlcitta2Fy   ' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Commit patch
        run: |
          git config user.name "VELTRO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix WTS live polling and persistent session"
