name: Optimize WTS runtime
on:
  push:
    paths:
      - '.github/workflows/optimize-wts-runtime.yml'
      - '.github/scripts/optimize_wts_runtime.py'
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/optimize_wts_runtime.py
      - name: Validate optimized runtime
        run: |
          grep -q "setTimeout(quoteLoop,1200)" index.html
          grep -q "const changed=lp()!==beforeLast" index.html
          ! grep -q "timers=\[\]" index.html
      - name: Commit optimized WTS
        run: |
          git config user.name "VELTRO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Optimize WTS quote rendering"
          git push
