name: Build VELTRO Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/android/**'
      - '.github/workflows/build-veltro-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: mobile/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p mobile/android/dist
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk mobile/android/dist/VELTRO_Mobile_v1.0.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VELTRO_Mobile_v1.0.0
          path: mobile/android/dist/VELTRO_Mobile_v1.0.0.apk
          if-no-files-found: error

      - name: Publish Android test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-v1.0.0 --cleanup-tag -y || true
          gh release create android-v1.0.0 \
            mobile/android/dist/VELTRO_Mobile_v1.0.0.apk \
            --title 'VELTRO Android v1.0.0' \
            --notes 'Initial Android test APK for VELTRO. Uses the existing WTS and existing backend data without changing HTS/WTS business logic or database structures.'
