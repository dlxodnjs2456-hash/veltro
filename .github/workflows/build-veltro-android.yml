name: Build VELTRO Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/android/**'
      - '.github/workflows/build-veltro-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Apply v1.0.7 runtime metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('mobile/android/app/src/main/java/kr/co/veltro/mobile/MainActivity.java')
          s=p.read_text(encoding='utf-8')
          s=s.replace('APP_VERSION = "1.0.5"','APP_VERSION = "1.0.7"')
          s=s.replace('?app=mts&v=105','?app=mts&v=107')
          s=s.replace('version.json?v=105','version.json?v=107')
          s=s.replace('VELTRO-Android/1.0.5','VELTRO-Android/1.0.7')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Verify Android version
        run: |
          grep "versionCode 8" mobile/android/app/build.gradle
          grep "versionName '1.0.7'" mobile/android/app/build.gradle
          grep 'APP_VERSION = "1.0.7"' mobile/android/app/src/main/java/kr/co/veltro/mobile/MainActivity.java
          grep 'VELTRO-Android/1.0.7' mobile/android/app/src/main/java/kr/co/veltro/mobile/MainActivity.java
          grep 'SOFT_INPUT_ADJUST_RESIZE' mobile/android/app/src/main/java/kr/co/veltro/mobile/MainActivity.java
          grep 'windowSoftInputMode="adjustResize|stateHidden"' mobile/android/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: mobile/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p mobile/android/dist
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk mobile/android/dist/VELTRO_Mobile_v1.0.7.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VELTRO_Mobile_v1.0.7
          path: mobile/android/dist/VELTRO_Mobile_v1.0.7.apk
          if-no-files-found: error

      - name: Publish Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-v1.0.7 --cleanup-tag -y || true
          gh release create android-v1.0.7 \
            mobile/android/dist/VELTRO_Mobile_v1.0.7.apk \
            --title 'VELTRO Android v1.0.7' \
            --notes 'MTS v1.0.7. Includes the latest mobile input focus fix so Android keyboard resize does not recreate active input fields. Existing trading/account behavior is preserved.'
