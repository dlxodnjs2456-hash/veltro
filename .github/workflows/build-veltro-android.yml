name: Build VELTRO Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/android/**'
      - '.github/workflows/build-veltro-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify Android version
        run: |
          grep "versionCode 4" mobile/android/app/build.gradle
          grep "versionName '1.0.3'" mobile/android/app/build.gradle
          grep 'VELTRO-Android/1.0.3' mobile/android/app/src/main/java/kr/co/veltro/mobile/MainActivity.java

      - name: Build APK
        working-directory: mobile/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p mobile/android/dist
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk mobile/android/dist/VELTRO_Mobile_v1.0.3.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VELTRO_Mobile_v1.0.3
          path: mobile/android/dist/VELTRO_Mobile_v1.0.3.apk
          if-no-files-found: error

      - name: Publish Android test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-v1.0.3 --cleanup-tag -y || true
          gh release create android-v1.0.3 \
            mobile/android/dist/VELTRO_Mobile_v1.0.3.apk \
            --title 'VELTRO Android v1.0.3' \
            --notes 'Stability release for the shared WTS/MTS runtime: improved WebView resume/reconnect behavior, fresh app entry URL, safer rendering, and network retry handling. Trading, member, balance, position, order, deposit/withdrawal and database semantics are unchanged.'
