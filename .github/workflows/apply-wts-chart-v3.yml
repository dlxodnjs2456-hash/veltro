name: Apply WTS MTS chart v3 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-wts-chart-v3.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load HTS-style WTS chart patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/wts-chart-v3.js?v=20260901-1"></script>'
          if tag not in s:
              anchor='<script src="/wts-hotfix-v2.js?v=20260901-2"></script>'
              if anchor in s:
                  s=s.replace(anchor,anchor+'\n'+tag,1)
              elif '</body>' in s:
                  s=s.replace('</body>',tag+'\n</body>',1)
              else:
                  raise SystemExit('script injection anchor missing')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit index patch
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load WTS MTS HTS-style chart v3'
          git push
