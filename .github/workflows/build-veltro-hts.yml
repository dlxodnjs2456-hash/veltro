name: Build and publish VELTRO HTS

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/RELEASE'
      - '.github/workflows/build-veltro-hts.yml'

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild and validate desktop source
        shell: powershell
        run: |
          if (Test-Path desktop/build) { Remove-Item desktop/build -Recurse -Force }
          $p0 = Get-Content desktop/v102_parts/part_00 -Raw
          if ($p0.Length -lt 9000) { throw 'part_00 is too short' }
          $b64 = $p0.Substring(0,9000)
          foreach ($i in 1..5) { $b64 += Get-Content ("desktop/v102_parts/part_{0:D2}" -f $i) -Raw }
          $b64 += Get-Content desktop/v102_parts/part_06 -Raw
          $b64 += Get-Content desktop/v102_parts/part_06b -Raw
          foreach ($i in 7..13) { $b64 += Get-Content ("desktop/v102_parts/part_{0:D2}" -f $i) -Raw }
          $b64 += Get-Content desktop/v102_parts/part_14a -Raw
          $b64 += Get-Content desktop/v102_parts/part_14b -Raw
          foreach ($i in 15..16) { $b64 += Get-Content ("desktop/v102_parts/part_{0:D2}" -f $i) -Raw }
          $b64 = $b64 -replace '\s',''
          if ($b64.Length -ne 150648) { throw "Unexpected source base64 length: $($b64.Length)" }
          $bytes = [Convert]::FromBase64String($b64)
          $zipPath = Join-Path $PWD 'desktop/source.zip'
          [IO.File]::WriteAllBytes($zipPath, $bytes)
          $sha = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLower()
          if ($sha -ne '3919c6cb70eebfc8f9522e558187a5640127747c623170f8dac207182c4d48fb') { throw "Source SHA256 mismatch: $sha" }
          Expand-Archive -Path $zipPath -DestinationPath desktop/build -Force
          if (!(Test-Path desktop/build/package.json)) { throw 'package.json missing after extraction' }

      - name: Install dependencies
        working-directory: desktop/build
        run: npm install --no-audit --no-fund

      - name: Validate sources
        working-directory: desktop/build
        run: |
          node --check src/main.js
          node --check src/preload.js
          node --check src/renderer.js

      - name: Build NSIS installer
        working-directory: desktop/build
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release:win

      - name: Read version
        id: version
        shell: powershell
        run: |
          $v = node -p "require('./desktop/build/package.json').version"
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT

      - name: Replace release if rebuilding same version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --cleanup-tag --yes
          fi

      - name: Publish installer release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" \
            desktop/build/dist/VELTRO_HTS_Setup.exe \
            desktop/build/dist/VELTRO_HTS_Setup.exe.blockmap \
            desktop/build/dist/latest.yml \
            --target main \
            --latest \
            --title "VELTRO HTS v$VERSION" \
            --notes "VELTRO HTS Windows installer. Existing installations update automatically from this release."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VELTRO-HTS-Setup-${{ steps.version.outputs.version }}
          path: |
            desktop/build/dist/VELTRO_HTS_Setup.exe
            desktop/build/dist/VELTRO_HTS_Setup.exe.blockmap
            desktop/build/dist/latest.yml
