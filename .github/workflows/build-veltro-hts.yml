name: Build and publish VELTRO HTS

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/RELEASE'
      - '.github/workflows/build-veltro-hts.yml'

permissions:
  contents: write

concurrency:
  group: veltro-hts-release
  cancel-in-progress: false

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content desktop/RELEASE -Raw -Encoding UTF8).Trim()
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "desktop/RELEASE must contain only x.y.z, got: $v" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "VELTRO release version: $v"

      - name: Rebuild verified v1.0.12 base
        shell: pwsh
        run: |
          @'
          import pathlib, re, subprocess, sys, textwrap

          root = pathlib.Path.cwd()
          base_workflow_path = root / '.github' / 'workflows' / 'build-veltro-hts.yml'
          current_workflow = base_workflow_path.read_text(encoding='utf-8')
          legacy_ref = 'd8e4b5720be775c2161d21e0fa251f882bf35f9c'
          legacy_workflow = subprocess.check_output(
              ['git', 'show', f'{legacy_ref}:.github/workflows/build-veltro-hts.yml'],
              text=True,
              encoding='utf-8',
          )

          try:
              base_workflow_path.write_text(legacy_workflow, encoding='utf-8')
              wf_path = root / '.github' / 'workflows' / 'build-veltro-hts-v112.yml'
              wf = wf_path.read_text(encoding='utf-8')

              m1 = re.search(
                  r"- name: Rebuild v1\.0\.11 source exactly.*?run: \|\s*@'\s*\n(.*?)\n\s*'@ \| Set-Content -Path extract_v111\.py",
                  wf,
                  re.S,
              )
              if not m1:
                  raise RuntimeError('Could not extract the verified v1.0.11 rebuild bootstrap')
              bootstrap = textwrap.dedent(m1.group(1))
              exec(compile(bootstrap, 'extract_v111.py', 'exec'), {'__name__': '__main__'})
              subprocess.run([sys.executable, 'make_v111.py'], check=True)
              subprocess.run([sys.executable, 'patch_v111.py'], check=True)

              m2 = re.search(
                  r"- name: Apply v1\.0\.12 login-poster-only runtime fix.*?run: \|\s*@'\s*\n(.*?)\n\s*'@ \| Set-Content -Path patch_v112\.py",
                  wf,
                  re.S,
              )
              if not m2:
                  raise RuntimeError('Could not extract the verified v1.0.12 patch')
              patch112 = textwrap.dedent(m2.group(1))
              exec(compile(patch112, 'patch_v112.py', 'exec'), {'__name__': '__main__'})
          finally:
              base_workflow_path.write_text(current_workflow, encoding='utf-8')

          if not (root / 'desktop' / 'build' / 'package.json').exists():
              raise RuntimeError('v1.0.12 base rebuild did not produce desktop/build')
          print('Verified v1.0.12 base reconstructed')
          '@ | Set-Content -Path rebuild_verified_base.py -Encoding UTF8
          python rebuild_verified_base.py

      - name: Apply current VELTRO patch
        shell: pwsh
        env:
          VELTRO_VERSION: ${{ steps.version.outputs.version }}
        run: python desktop/patch/current.py

      - name: Install dependencies
        working-directory: desktop/build
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript
        working-directory: desktop/build
        run: |
          node --check src/main.js
          node --check src/preload.js
          node --check src/renderer.js

      - name: Build NSIS installer
        working-directory: desktop/build
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release:win

      - name: Publish auto-update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --cleanup-tag --yes
          fi
          gh release create "$TAG" \
            desktop/build/dist/VELTRO_HTS_Setup.exe \
            desktop/build/dist/VELTRO_HTS_Setup.exe.blockmap \
            desktop/build/dist/latest.yml \
            --target main \
            --latest \
            --title "VELTRO HTS v${VERSION}" \
            --notes "VELTRO HTS automatic patch release. Built from the verified v1.0.12 base plus desktop/patch/current.py. Existing trading, market-data, account, DB, member, balance, order, position, deposit/withdrawal, notification, and updater behavior is preserved unless explicitly patched."

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: VELTRO-HTS-Setup-${{ steps.version.outputs.version }}
          path: |
            desktop/build/dist/VELTRO_HTS_Setup.exe
            desktop/build/dist/VELTRO_HTS_Setup.exe.blockmap
            desktop/build/dist/latest.yml
