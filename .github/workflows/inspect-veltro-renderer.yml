name: Inspect VELTRO renderer runtime
on:
  push:
    paths:
      - '.github/workflows/inspect-veltro-renderer.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild patched renderer
        shell: pwsh
        run: |
          @'
          import pathlib,re,subprocess,sys,textwrap
          root=pathlib.Path.cwd(); bp=root/'.github'/'workflows'/'build-veltro-hts.yml'; cur=bp.read_text(encoding='utf-8')
          legacy_ref='d8e4b5720be775c2161d21e0fa251f882bf35f9c'; legacy=subprocess.check_output(['git','show',f'{legacy_ref}:.github/workflows/build-veltro-hts.yml'],text=True,encoding='utf-8')
          try:
            bp.write_text(legacy,encoding='utf-8'); wf=(root/'.github'/'workflows'/'build-veltro-hts-v112.yml').read_text(encoding='utf-8')
            m1=re.search(r"- name: Rebuild v1\.0\.11 source exactly.*?run: \|\s*@'\s*\n(.*?)\n\s*'@ \| Set-Content -Path extract_v111\.py",wf,re.S); exec(compile(textwrap.dedent(m1.group(1)),'x.py','exec'),{'__name__':'__main__'}); subprocess.run([sys.executable,'make_v111.py'],check=True); subprocess.run([sys.executable,'patch_v111.py'],check=True)
            m2=re.search(r"- name: Apply v1\.0\.12 login-poster-only runtime fix.*?run: \|\s*@'\s*\n(.*?)\n\s*'@ \| Set-Content -Path patch_v112\.py",wf,re.S); exec(compile(textwrap.dedent(m2.group(1)),'y.py','exec'),{'__name__':'__main__'})
          finally: bp.write_text(cur,encoding='utf-8')
          '@ | Set-Content inspect_rebuild.py
          $env:VELTRO_VERSION='1.0.30'
          python inspect_rebuild.py
          python desktop/patch/current.py
          python desktop/patch/chart_v20.py
          python desktop/patch/ls_only_v21.py
          python desktop/patch/databento_chart_v22.py
          python desktop/patch/databento_chart_v23.py
          python desktop/patch/indicators_v24.py
          python desktop/patch/hsi_ls_v25.py
          python desktop/patch/hsi_ref_v26.py
          python desktop/patch/hsi_history_v27.py
          python desktop/patch/hsi_ipc_v28.py
      - name: Print trading and timer anchors
        shell: pwsh
        run: |
          @'
          import pathlib,re
          s=pathlib.Path('desktop/build/src/renderer.js').read_text(encoding='utf-8')
          terms=['setInterval','position','unreal','pnl','placeOrder','submitOrder','closePosition','tradePost','refresh','loadAccount','market-tick','renderTrading','positions']
          lines=s.splitlines()
          seen=set()
          for i,line in enumerate(lines):
            low=line.lower()
            if any(t.lower() in low for t in terms):
              a=max(0,i-2); b=min(len(lines),i+3); key=(a,b)
              if key in seen: continue
              seen.add(key); print(f'--- lines {a+1}-{b} ---'); print('\n'.join(lines[a:b])[:7000])
          '@ | Set-Content inspect_renderer.py
          python inspect_renderer.py
