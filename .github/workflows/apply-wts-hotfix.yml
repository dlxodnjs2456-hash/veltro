name: Apply WTS hotfix once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-wts-hotfix.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject hotfix script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/wts-hotfix-v2.js?v=20260901-2"></script>'
          if tag not in s:
              if '</body>' not in s: raise SystemExit('body close not found')
              s=s.replace('</body>',tag+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patched index
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load WTS MTS hotfix v2'
          git push
# trigger-2
