name: Apply WTS live provider v7 once
on:
  push:
    paths:
      - '.github/workflows/apply-wts-live-provider-v7.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inject provider script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/wts-live-provider-v7.js?v=20260901-1"></script>'
          if tag not in s:
              anchor='</body>'
              if anchor not in s: raise SystemExit('body anchor missing')
              s=s.replace(anchor,tag+'\n'+anchor,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Validate protected flows
        run: |
          grep -q "submit_order" index.html
          grep -q "close_position" index.html
          grep -q "입금확인요청" index.html
          grep -q "wts-runtime-v6.js" index.html
          grep -q "wts-live-provider-v7.js" index.html
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Enable Databento live provider state"
          git push
