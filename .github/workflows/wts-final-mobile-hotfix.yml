name: WTS final mobile hotfix

on:
  push:
    paths:
      - '.github/workflows/wts-final-mobile-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch WTS mobile/desktop rendering
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""function mobile(){if(page!=='trade')return generic();return tradePage()}\nfunction renderAll(){if(chart){try{chart.destroy()}catch{}chart=null}symbolMenus();$('#user').textContent=profile?.login_id||'-';$('#mUser').textContent=profile?.login_id||'-';$('#balance').textContent=fmt(bal());$('#grid').classList.toggle('no-order',page!=='trade');$('#right').classList.toggle('hidden',page!=='trade');$('#main').innerHTML=generic();$('#order').innerHTML=page==='trade'?orderPanel():'';$('#mMain').innerHTML=mobile();$$('.nav[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page));bind();if(page==='trade'&&tab==='chart')setTimeout(drawChart,0)}"""
          new="""function isMobile(){return window.innerWidth<=820}\nfunction mobile(){if(page!=='trade')return generic();const a=trading.account||{},head=`<div class=\"market-head\"><div><b>${cur.symbol} · ${cur.name}</b><small>${cur.exchange} · ${cur.month}</small></div><div class=\"last mono\">${pf(lp())}</div></div>`;if(tab==='quote')return head+`<section class=\"center\"><div class=\"book\">${ladder()}</div><aside class=\"summary\"><h3>계좌/종목 정보</h3><div class=\"kv\"><span>잔고</span><b>${fmt(bal())}원</b><span>매수담보금</span><b>${fmt(a.buy_margin)}원</b><span>매도담보금</span><b>${fmt(a.sell_margin)}원</b><span>오버나잇</span><b>${a.overnight_enabled?'적용':'미적용'}</b></div><button id=\"overnight\" class=\"secondary\" style=\"margin-top:12px\">${a.overnight_enabled?'오버나잇 해제':'오버나잇 적용'}</button></aside></section>`;if(tab==='positions')return head+`<section class=\"card\" style=\"overflow:auto\">${positions()}</section>`;if(tab==='fills')return head+`<section class=\"card\" style=\"overflow:auto\">${fills()}</section>`;if(tab==='info')return head+`<section class=\"page\"><div class=\"form\"><label>거래소</label><b>${cur.exchange}</b><label>종목</label><b>${cur.name}</b><label>계약월</label><span>${cur.month}</span><label>틱 사이즈</label><span>${cur.tick}</span><label>틱 가치</label><span>${fmt(cur.tickValue)}원</span><label>매수담보금</label><span>${fmt(a.buy_margin)}원</span><label>매도담보금</label><span>${fmt(a.sell_margin)}원</span><label>오버나잇담보금</label><span>${fmt(a.overnight_margin)}원</span></div></section>`;return head+`<section class=\"card chart-wrap\"><div class=\"chart-tools\"><select id=\"tf\"><option value=\"1\">1분</option><option value=\"2\">5분</option><option value=\"3\">15분</option><option value=\"4\">30분</option><option value=\"5\">1시간</option></select><button id=\"chartReload\">새로고침</button><span id=\"chartState\" style=\"font-size:11px;color:#667085\">iTick 실시간 누적</span></div><div id=\"chartBox\"></div></section>`}\nfunction renderAll(){if(chart){try{chart.destroy()}catch{}chart=null}symbolMenus();$('#user').textContent=profile?.login_id||'-';$('#mUser').textContent=profile?.login_id||'-';$('#balance').textContent=fmt(bal());const mob=isMobile();$('#grid').classList.toggle('no-order',page!=='trade');$('#right').classList.toggle('hidden',page!=='trade'||mob);if(mob){$('#main').innerHTML='';$('#order').innerHTML='';$('#mMain').innerHTML=mobile()}else{$('#main').innerHTML=generic();$('#order').innerHTML=page==='trade'?orderPanel():'';$('#mMain').innerHTML=''}$$('.nav[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page));bind();if(page==='trade'&&tab==='chart')setTimeout(drawChart,0)}"""
          if old not in s:
              raise SystemExit('target render block not found')
          s=s.replace(old,new)
          old_timer="""async function startTimers(){timers.forEach(clearInterval);timers=[setInterval(async()=>{if(!token)return;try{await loadQuote();if(page==='trade'&&tab==='quote'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))renderAll()}catch{}},3000),setInterval(async()=>{if(!token)return;try{await Promise.all([loadTrading(),loadDash()]);if(!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))renderAll()}catch{}},5000),setInterval(()=>{if(page==='trade'&&tab==='chart')drawChart()},30000)]}"""
          new_timer="""async function startTimers(){timers.forEach(clearInterval);timers=[setInterval(async()=>{if(!token)return;try{await loadQuote();if(page==='trade'&&tab==='quote'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))renderAll()}catch{}},3000),setInterval(async()=>{if(!token)return;try{await Promise.all([loadTrading(),loadDash()]);if(tab!=='chart'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))renderAll()}catch{}},5000),setInterval(()=>{if(page==='trade'&&tab==='chart')drawChart()},30000)]}"""
          if old_timer not in s:
              raise SystemExit('timer block not found')
          s=s.replace(old_timer,new_timer)
          needle="$$('#mTabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderAll()});\n</script>"
          if needle not in s:
              raise SystemExit('script tail not found')
          s=s.replace(needle,"$$('#mTabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderAll()});window.addEventListener('resize',()=>{if(token)renderAll()});\n</script>")
          p.write_text(s,encoding='utf-8')
      - name: Patch backup candidate
        run: cp index.html wts-v1.html
      - name: Commit hotfix
        run: |
          git config user.name "VELTRO Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html wts-v1.html
          git commit -m "Finalize responsive WTS rendering" || exit 0
          git push