<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VELTRO Lightweight Charts Test</title>
<style>
:root{--bg:#eef2f6;--panel:#fff;--line:#d8dee7;--text:#111827;--muted:#667085;--brand:#1687d9;--brand2:#38bdf8}
*{box-sizing:border-box}body{margin:0;font-family:Arial,'Malgun Gothic',sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.wrap{max-width:1380px;margin:0 auto;padding:8px}.top,.controls,.login,.diag{background:#fff;border:1px solid var(--line)}.top{height:48px;display:flex;align-items:center;padding:0 12px;gap:12px}.logo{font-size:22px;font-weight:900}.logo b{color:var(--brand2)}.status{margin-left:auto;font-size:12px;color:var(--muted)}.login,.controls{margin-top:10px;padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.login input,.controls select,.controls button{height:34px;border:1px solid #c9d1db;border-radius:6px;background:#fff;padding:0 10px}.btn{height:34px;border:0!important;border-radius:6px;background:var(--brand)!important;color:#fff;padding:0 14px;cursor:pointer}.controls button.active{background:var(--brand);border-color:var(--brand);color:#fff}.price{margin-left:auto;font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}.chart-card{margin-top:10px;background:#fff;border:1px solid var(--line)}#chart{height:650px}.meta{padding:9px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;gap:18px;flex-wrap:wrap}.ok{color:#0c9b6a}.error{color:#c0392b}.diag{margin-top:8px;padding:9px 12px;font-size:11px;color:#475467;white-space:pre-wrap;word-break:break-word}.note{margin-top:8px;padding:9px 12px;background:#f8fafc;border:1px solid var(--line);font-size:11px;color:#475467}.tv-credit{font-size:11px;color:#667085;margin-top:7px}.tv-credit a{color:#1687d9}@media(max-width:700px){.wrap{padding:0}.top,.login,.controls,.chart-card,.diag,.note{border-left:0;border-right:0}.login input{width:100%}#chart{height:520px}.price{width:100%;margin-left:0}}
</style>
<script src="https://unpkg.com/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js"></script>
</head><body><div class="wrap">
<div class="top"><div class="logo">VEL<b>TRO</b></div><strong>Lightweight Charts Test</strong><div id="conn" class="status">로그인 필요</div></div>
<div id="loginBox" class="login"><input id="loginId" placeholder="VELTRO 아이디"><input id="loginPw" type="password" placeholder="비밀번호"><button id="loginBtn" class="btn">로그인 후 차트 연결</button><span id="loginMsg" class="error"></span></div>
<div id="tradeBox" class="controls" style="display:none"><select id="symbol"><option value="NQ|US">NQ · E-mini Nasdaq 100</option><option value="ES|US">ES · E-mini S&P 500</option><option value="CL|US">CL · Crude Oil</option><option value="GC|US">GC · Gold</option><option value="SI|US">SI · Silver</option><option value="6B|US">6B · British Pounds</option><option value="6E|US">6E · Euro FX</option><option value="6J|US">6J · Japanese Yen</option><option value="HSI|HK">HSI · Hang Seng Index</option></select><button data-k="1" class="active">1분</button><button data-k="2">5분</button><button data-k="3">15분</button><button data-k="4">30분</button><button data-k="5">1시간</button><select id="limit"><option value="200">200봉</option><option value="500" selected>500봉</option><option value="1000">1000봉</option></select><button id="reload">새로고침</button><div id="last" class="price">-</div></div>
<div class="chart-card"><div id="chart"></div><div class="meta"><span id="source">Source: -</span><span id="via">Via: -</span><span id="bars">Bars: 0</span><span id="range">Range: -</span><span id="state">State: 대기</span></div></div>
<div id="diag" class="diag">Diagnostics: -</div>
<div class="note">정식 iTick K-line이 성공하면 Source가 itick으로 표시됩니다. live_samples가 나오면 아래 Diagnostics에 iTick 원문 오류가 표시됩니다.</div><div class="tv-credit">TradingView Lightweight Charts™ — <a href="https://www.tradingview.com/" target="_blank" rel="noopener">TradingView</a></div>
</div><script>
const U='https://mzjkvakigwtlibwlslhq.supabase.co',K='sb_publishable_E3h8Gqx-RQqvAxiNXvBhKQ_WZIfGd4t',AUTH=U+'/functions/v1/auth-api',MARKET=U+'/functions/v1/market-data-api';let token='',kType=1,currentBars=[],poll=null;const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const chart=LightweightCharts.createChart($('#chart'),{autoSize:true,layout:{background:{type:'solid',color:'#fff'},textColor:'#344054',attributionLogo:true},grid:{vertLines:{color:'#eef1f4'},horzLines:{color:'#eef1f4'}},rightPriceScale:{borderColor:'#d8dee7'},timeScale:{borderColor:'#d8dee7',timeVisible:true,secondsVisible:false,rightOffset:8,barSpacing:7,minBarSpacing:2},crosshair:{mode:LightweightCharts.CrosshairMode.Normal}});const candles=chart.addSeries(LightweightCharts.CandlestickSeries,{upColor:'#d84d48',downColor:'#2d66c9',borderUpColor:'#d84d48',borderDownColor:'#2d66c9',wickUpColor:'#d84d48',wickDownColor:'#2d66c9'});const volume=chart.addSeries(LightweightCharts.HistogramSeries,{priceFormat:{type:'volume'},priceScaleId:'volume',lastValueVisible:false,priceLineVisible:false});volume.priceScale().applyOptions({scaleMargins:{top:.82,bottom:0}});
async function post(url,body,auth=true){const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json',apikey:K,Authorization:'Bearer '+(auth?token:K)},body:JSON.stringify(body)});let j={};try{j=await r.json()}catch{}if(!r.ok)throw Object.assign(new Error(j.error||j.detail||'request_failed'),{payload:j});return j}function selected(){const [code,region]=$('#symbol').value.split('|');return{code,region}}function normalize(arr){if(!Array.isArray(arr))return[];const out=[];for(const x of arr){const t=Number(x?.t??x?.time),o=Number(x?.o??x?.open),h=Number(x?.h??x?.high),l=Number(x?.l??x?.low),c=Number(x?.c??x?.close),v=Number(x?.v??x?.volume??0);if(!Number.isFinite(t)||![o,h,l,c].every(Number.isFinite))continue;out.push({time:Math.floor(t>1e12?t/1000:t),open:o,high:h,low:l,close:c,volume:Number.isFinite(v)?v:0})}out.sort((a,b)=>a.time-b.time);return out.filter((b,i,a)=>!i||b.time!==a[i-1].time)}function volumeData(b){return b.map(x=>({time:x.time,value:x.volume,color:x.close>=x.open?'rgba(216,77,72,.45)':'rgba(45,102,201,.45)'}))}
function diagnosticText(r){const d=Array.isArray(r?.diagnostics)?r.diagnostics:[];if(!d.length)return 'Diagnostics: 없음';return 'Diagnostics:\n'+d.map(x=>`• ${x.attempt||'-'} | HTTP ${x.httpStatus??'-'} | iTick ${x.itickCode??'-'} | ${x.message||'-'}`).join('\n')}
async function loadKline(){const {code,region}=selected();$('#state').textContent='State: 과거봉 조회 중...';$('#state').className='';const r=await post(MARKET,{action:'kline',region,code,kType,limit:Number($('#limit').value)});$('#source').textContent='Source: '+(r.source||'-');$('#via').textContent='Via: '+(r.via||'-');$('#diag').textContent=diagnosticText(r);const bars=normalize(r.bars);$('#bars').textContent='Bars: '+bars.length;if(!bars.length)throw Error('K-line 0건');currentBars=bars;candles.setData(bars.map(({time,open,high,low,close})=>({time,open,high,low,close})));volume.setData(volumeData(bars));chart.timeScale().fitContent();const a=new Date(bars[0].time*1000).toLocaleString('ko-KR'),z=new Date(bars.at(-1).time*1000).toLocaleString('ko-KR');$('#range').textContent='Range: '+a+' ~ '+z;$('#last').textContent=bars.at(-1).close.toLocaleString('en-US');$('#state').textContent='State: '+(r.source==='itick'||r.source==='itick_cache'?'정식 과거봉 정상':'백업 샘플 사용 중');$('#state').className=r.source.startsWith('itick')?'ok':'error'}
function intervalSec(){return({1:60,2:300,3:900,4:1800,5:3600})[kType]||60}async function loadQuote(){const {code,region}=selected();const r=await post(MARKET,{action:'quote',region,code});const q=r.quote||r.data||r,p=Number(q?.ld??q?.last??q?.price),ms=Number(q?.t)||Date.now();if(!Number.isFinite(p)||p<=0)return;$('#last').textContent=p.toLocaleString('en-US');if(!currentBars.length)return;const sec=intervalSec(),bucket=Math.floor((ms>1e12?ms/1000:ms)/sec)*sec,last=currentBars.at(-1);let next;if(bucket===last.time)next={...last,high:Math.max(last.high,p),low:Math.min(last.low,p),close:p};else if(bucket>last.time){next={time:bucket,open:p,high:p,low:p,close:p,volume:0};currentBars.push(next)}else return;candles.update({time:next.time,open:next.open,high:next.high,low:next.low,close:next.close});volume.update({time:next.time,value:next.volume||0,color:next.close>=next.open?'rgba(216,77,72,.45)':'rgba(45,102,201,.45)'})}
async function start(){clearInterval(poll);await loadKline();try{await loadQuote()}catch(e){$('#conn').textContent='현재가 오류: '+e.message}poll=setInterval(()=>loadQuote().catch(e=>$('#conn').textContent='현재가 오류: '+e.message),3000)}
$('#loginBtn').onclick=async()=>{try{$('#loginMsg').textContent='';const r=await post(AUTH,{action:'login',login_id:$('#loginId').value.trim(),password:$('#loginPw').value},false);token=r.session?.access_token||'';if(!token)throw Error('세션 발급 실패');$('#conn').textContent='LIVE · iTick';$('#conn').className='status ok';$('#loginBox').style.display='none';$('#tradeBox').style.display='flex';await start()}catch(e){$('#loginMsg').textContent=e.message==='invalid_credentials'?'아이디 또는 비밀번호를 확인하세요.':e.message}};$('#loginPw').onkeydown=e=>{if(e.key==='Enter')$('#loginBtn').click()};$$('[data-k]').forEach(b=>b.onclick=()=>{kType=Number(b.dataset.k);$$('[data-k]').forEach(x=>x.classList.toggle('active',x===b));start().catch(e=>{$('#state').textContent='State: '+e.message;$('#state').className='error';if(e.payload?.diagnostics)$('#diag').textContent=diagnosticText(e.payload)})});$('#symbol').onchange=$('#limit').onchange=$('#reload').onclick=()=>start().catch(e=>{$('#state').textContent='State: '+e.message;$('#state').className='error';if(e.payload?.diagnostics)$('#diag').textContent=diagnosticText(e.payload)});
</script></body></html>
