<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VELTRO Lightweight Charts Test</title>
<style>
:root{--bg:#eef2f6;--panel:#fff;--line:#d8dee7;--text:#111827;--muted:#667085;--brand:#1687d9;--brand2:#38bdf8;--nav:#0b1e2d}
*{box-sizing:border-box}body{margin:0;font-family:Arial,'Malgun Gothic',sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.wrap{max-width:1380px;margin:0 auto;padding:14px}.top{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);padding:10px 12px}.logo{font-size:22px;font-weight:900}.logo b{color:var(--brand2)}.top .status{margin-left:auto;font-size:12px;color:var(--muted)}.login{margin-top:10px;background:#fff;border:1px solid var(--line);padding:12px;display:flex;gap:8px;align-items:center}.login input{height:36px;border:1px solid #c9d1db;border-radius:6px;padding:0 9px}.btn{height:36px;border:0;border-radius:6px;background:var(--brand);color:#fff;padding:0 14px;cursor:pointer}.controls{margin-top:10px;background:#fff;border:1px solid var(--line);padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.controls select,.controls button{height:34px;border:1px solid #c9d1db;border-radius:6px;background:#fff;padding:0 10px}.controls button.active{background:var(--brand);border-color:var(--brand);color:#fff}.price{margin-left:auto;font-size:23px;font-weight:900;font-variant-numeric:tabular-nums}.chart-card{margin-top:10px;background:#fff;border:1px solid var(--line)}#chart{height:650px}.meta{padding:9px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;gap:18px;flex-wrap:wrap}.error{color:#c0392b}.ok{color:#0c9b6a}.note{margin-top:10px;padding:10px 12px;background:#f8fafc;border:1px solid var(--line);font-size:12px;color:#475467}.tv-credit{font-size:11px;color:#667085;margin-top:8px}.tv-credit a{color:#1687d9}
@media(max-width:700px){.wrap{padding:0}.top,.login,.controls{border-left:0;border-right:0}.login{flex-wrap:wrap}.login input{width:100%}#chart{height:520px}.price{width:100%;margin-left:0}}
</style>
<script src="https://unpkg.com/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="logo">VEL<b>TRO</b></div><strong>Lightweight Charts Test</strong><div id="conn" class="status">로그인 필요</div></div>
  <div id="loginBox" class="login"><input id="loginId" placeholder="VELTRO 아이디"><input id="loginPw" type="password" placeholder="비밀번호"><button id="loginBtn" class="btn">로그인 후 차트 연결</button><span id="loginMsg" class="error"></span></div>
  <div id="tradeBox" class="controls" style="display:none">
    <select id="symbol"><option value="NQ|US">NQ · E-mini Nasdaq 100</option><option value="ES|US">ES · E-mini S&P 500</option><option value="CL|US">CL · Crude Oil</option><option value="GC|US">GC · Gold</option><option value="SI|US">SI · Silver</option><option value="6B|US">6B · British Pounds</option><option value="6E|US">6E · Euro FX</option><option value="6J|US">6J · Japanese Yen</option><option value="HSI|HK">HSI · Hang Seng Index</option></select>
    <button data-k="1" class="active">1분</button><button data-k="2">5분</button><button data-k="3">15분</button><button data-k="4">30분</button><button data-k="5">1시간</button>
    <select id="limit"><option value="200">200봉</option><option value="500" selected>500봉</option><option value="1000">1000봉</option></select>
    <button id="reload">새로고침</button><div id="last" class="price">-</div>
  </div>
  <div class="chart-card"><div id="chart"></div><div class="meta"><span id="source">Source: -</span><span id="bars">Bars: 0</span><span id="range">Range: -</span><span id="state">State: 대기</span></div></div>
  <div class="note">이 테스트는 VELTRO 기존 Supabase 로그인과 iTick 시세 API를 그대로 사용합니다. 과거 OHLCV가 정상적으로 내려오면 이 모듈을 WTS와 HTS 차트 화면에 그대로 통합할 수 있습니다.</div>
  <div class="tv-credit">TradingView Lightweight Charts™ — <a href="https://www.tradingview.com/" target="_blank" rel="noopener">TradingView</a></div>
</div>
<script>
const U='https://mzjkvakigwtlibwlslhq.supabase.co',K='sb_publishable_E3h8Gqx-RQqvAxiNXvBhKQ_WZIfGd4t',AUTH=U+'/functions/v1/auth-api',MARKET=U+'/functions/v1/market-data-api';
let token='',kType=1,currentBars=[],poll=null,lastQuote=null;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const chart=LightweightCharts.createChart($('#chart'),{autoSize:true,layout:{background:{type:'solid',color:'#ffffff'},textColor:'#344054',attributionLogo:true},grid:{vertLines:{color:'#eef1f4'},horzLines:{color:'#eef1f4'}},rightPriceScale:{borderColor:'#d8dee7'},timeScale:{borderColor:'#d8dee7',timeVisible:true,secondsVisible:false,rightOffset:8,barSpacing:7,minBarSpacing:2},crosshair:{mode:LightweightCharts.CrosshairMode.Normal}});
const candles=chart.addSeries(LightweightCharts.CandlestickSeries,{upColor:'#d84d48',downColor:'#2d66c9',borderUpColor:'#d84d48',borderDownColor:'#2d66c9',wickUpColor:'#d84d48',wickDownColor:'#2d66c9',priceLineVisible:true});
const volume=chart.addSeries(LightweightCharts.HistogramSeries,{priceFormat:{type:'volume'},priceScaleId:'volume',lastValueVisible:false,priceLineVisible:false});
volume.priceScale().applyOptions({scaleMargins:{top:0.82,bottom:0}});
async function post(url,body,auth=true){const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json',apikey:K,Authorization:'Bearer '+(auth?token:K)},body:JSON.stringify(body)});let j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j.error||j.detail||'request_failed');return j}
function selected(){const [code,region]=$('#symbol').value.split('|');return{code,region}}
function normalize(arr){if(!Array.isArray(arr))return[];const out=[];for(const x of arr){const t=Number(x?.t??x?.time??x?.timestamp);const o=Number(x?.o??x?.open),h=Number(x?.h??x?.high),l=Number(x?.l??x?.low),c=Number(x?.c??x?.close),v=Number(x?.v??x?.volume??0);if(!Number.isFinite(t)||![o,h,l,c].every(Number.isFinite))continue;out.push({time:Math.floor(t>1e12?t/1000:t),open:o,high:h,low:l,close:c,volume:Number.isFinite(v)?v:0})}out.sort((a,b)=>a.time-b.time);const unique=[];let prev=null;for(const b of out){if(b.time===prev){unique[unique.length-1]=b}else{unique.push(b);prev=b.time}}return unique}
function volumeData(bars){return bars.map(b=>({time:b.time,value:b.volume,color:b.close>=b.open?'rgba(216,77,72,.45)':'rgba(45,102,201,.45)'}))}
function showMeta(bars,source){$('#bars').textContent='Bars: '+bars.length;$('#source').textContent='Source: '+(source||'-');if(bars.length){const a=new Date(bars[0].time*1000).toLocaleString('ko-KR'),z=new Date(bars[bars.length-1].time*1000).toLocaleString('ko-KR');$('#range').textContent='Range: '+a+' ~ '+z;$('#last').textContent=bars[bars.length-1].close.toLocaleString('en-US');}else $('#range').textContent='Range: -'}
async function loadKline(){const {code,region}=selected();$('#state').textContent='State: 과거봉 조회 중...';const r=await post(MARKET,{action:'kline',region,code,kType,limit:Number($('#limit').value)});const raw=Array.isArray(r?.bars)?r.bars:(Array.isArray(r?.data)?r.data:[]);const bars=normalize(raw);if(!bars.length)throw Error('과거 K-line 데이터가 0건입니다. source='+(r?.source||'unknown'));currentBars=bars;candles.setData(bars.map(({time,open,high,low,close})=>({time,open,high,low,close})));volume.setData(volumeData(bars));chart.timeScale().fitContent();showMeta(bars,r?.source);$('#state').textContent='State: 정상';$('#state').className='ok';}
function intervalSec(){return({1:60,2:300,3:900,4:1800,5:3600})[kType]||60}
async function loadQuote(){const {code,region}=selected();const r=await post(MARKET,{action:'quote',region,code});const q=r?.quote||r?.data||r;const p=Number(q?.ld??q?.last??q?.price),ms=Number(q?.t)||Date.now();if(!Number.isFinite(p)||p<=0)return;lastQuote=q;$('#last').textContent=p.toLocaleString('en-US');if(!currentBars.length)return;const sec=intervalSec(),bucket=Math.floor((ms>1e12?ms/1000:ms)/sec)*sec,last=currentBars[currentBars.length-1];let next;if(bucket===last.time){next={...last,high:Math.max(last.high,p),low:Math.min(last.low,p),close:p,volume:Number(last.volume||0)+Number(q?.v||0)}}else if(bucket>last.time){next={time:bucket,open:p,high:p,low:p,close:p,volume:Number(q?.v||0)};currentBars.push(next)}else return;candles.update({time:next.time,open:next.open,high:next.high,low:next.low,close:next.close});volume.update({time:next.time,value:next.volume,color:next.close>=next.open?'rgba(216,77,72,.45)':'rgba(45,102,201,.45)'});}
async function start(){clearInterval(poll);await loadKline();await loadQuote();poll=setInterval(()=>loadQuote().catch(e=>{$('#conn').textContent='실시간 갱신 오류: '+e.message}),3000)}
$('#loginBtn').onclick=async()=>{try{$('#loginMsg').textContent='';const r=await post(AUTH,{action:'login',login_id:$('#loginId').value.trim(),password:$('#loginPw').value},false);if(!r.session?.access_token)throw Error('세션 발급 실패');token=r.session.access_token;$('#conn').textContent='LIVE · iTick';$('#conn').className='status ok';$('#loginBox').style.display='none';$('#tradeBox').style.display='flex';await start()}catch(e){$('#loginMsg').textContent=e.message==='invalid_credentials'?'아이디 또는 비밀번호를 확인하세요.':e.message}};
$('#loginPw').onkeydown=e=>{if(e.key==='Enter')$('#loginBtn').click()};
$$('[data-k]').forEach(b=>b.onclick=async()=>{kType=Number(b.dataset.k);$$('[data-k]').forEach(x=>x.classList.toggle('active',x===b));try{await start()}catch(e){$('#state').textContent='State: '+e.message;$('#state').className='error'}});
$('#symbol').onchange=()=>start().catch(e=>{$('#state').textContent='State: '+e.message;$('#state').className='error'});$('#limit').onchange=()=>start().catch(e=>{$('#state').textContent='State: '+e.message;$('#state').className='error'});$('#reload').onclick=()=>start().catch(e=>{$('#state').textContent='State: '+e.message;$('#state').className='error'});
</script>
</body></html>
