function moneyRows(){const ds=(accountData?.deposits||[]).map(x=>({t:x.created_at,k:x.request_type==='CRYPTO'?'코인입금':'계좌입금',a:x.amount,s:x.status})),ws=(accountData?.withdrawals||[]).map(x=>({t:x.created_at,k:'출금',a:x.amount,s:x.status}));return `<table class="table"><thead><tr><th>일시</th><th>구분</th><th>금액</th><th>상태</th></tr></thead><tbody>${[...ds,...ws].sort((a,b)=>new Date(b.t)-new Date(a.t)).slice(0,30).map(x=>`<tr><td>${new Date(x.t).toLocaleString('ko-KR')}</td><td>${x.k}</td><td>${fmt(x.a)}</td><td>${x.s}</td></tr>`).join('')||'<tr><td colspan="4">내역이 없습니다.</td></tr>'}</tbody></table>`}
function genericPage(){if(page==='money'){const a=accountData?.account||{};return `<section class="panel-page"><h2>입출금</h2><div class="form-grid"><label>현재잔고</label><b>${fmt(Number(a.cash_balance||0)+Number(a.realized_pnl||0))}원</b><label>입금금액</label><input id="depAmount" type="number"><label>입금자명</label><input id="depName" value="${profile?.account_holder||profile?.display_name||''}"><span></span><button class="primary" id="depBtn">입금신청</button><label>출금금액</label><input id="wdAmount" type="number"><label>출금계좌</label><div>${profile?.bank_name||'-'} ${profile?.bank_account||'-'} ${profile?.account_holder||''}</div><span></span><button class="primary" id="wdBtn">출금신청</button></div><h2 style="margin-top:30px">최근 신청내역</h2>${moneyRows()}</section>`}if(page==='alerts')return `<section class="panel-page"><h2>알림</h2>${(accountData?.notifications||[]).map(x=>`<div style="padding:12px;border-bottom:1px solid #e5e7eb;cursor:pointer" data-noti="${x.id}"><b>${x.title}</b><div style="margin-top:5px;color:#667085">${x.body}</div><small>${new Date(x.created_at).toLocaleString('ko-KR')}</small>${!x.read_at?'<span style="float:right;color:#1687d9">읽지 않음</span>':''}</div>`).join('')||'<div>알림이 없습니다.</div>'}</section>`;if(page==='history')return `<section class="panel-page"><h2>체결내역</h2>${fillsTable()}</section>`;if(page==='profile')return `<section class="panel-page"><h2>회원정보</h2><div class="form-grid"><label>아이디</label><b>${profile?.login_id||'-'}</b><label>이름</label><b>${profile?.display_name||'-'}</b><label>생년월일</label><span>${profile?.birth_date||'-'}</span><label>핸드폰</label><span>${profile?.phone||'-'}</span><label>이메일</label><span>${profile?.email||'-'}</span><label>은행</label><span>${profile?.bank_name||'-'}</span><label>계좌번호</label><span>${profile?.bank_account||'-'}</span><label>예금주</label><span>${profile?.account_holder||'-'}</span></div></section>`;if(page==='inquiry')return `<section class="panel-page"><h2>1:1 문의</h2><div class="form-grid"><label>제목</label><input id="iqSubject"><label>내용</label><textarea id="iqBody" rows="5"></textarea><span></span><button class="primary" id="iqBtn">문의등록</button></div><h2 style="margin-top:30px">문의내역</h2>${(accountData?.inquiries||[]).map(x=>`<div style="padding:10px;border-bottom:1px solid #eee"><b>${x.subject}</b><div>${x.body}</div></div>`).join('')||'문의내역이 없습니다.'}</section>`;return tradeDesktop()}
function mobileContent(){if(page!=='trade')return genericPage();const head=`<div class="m-market"><b>${current.symbol}</b> · ${current.name}<span class="m-price mono">${priceFmt(lastPrice())}</span><div style="clear:both;color:#667085;font-size:11px;margin-top:4px">${current.exchange} · ${current.month}</div></div>`;if(mTab==='quote')return head+`<div class="book">${ladder()}</div>`;if(mTab==='positions')return head+positionsTable();if(mTab==='fills')return head+fillsTable();if(mTab==='info')return head+`<section class="panel-page"><div class="form-grid"><label>거래소</label><b>${current.exchange}</b><label>종목</label><b>${current.name}</b><label>계약월</label><span>${current.month}</span><label>틱 사이즈</label><span>${current.tick}</span><label>틱 가치</label><span>${fmt(current.tickValue)}원</span><label>매수담보금</label><span>${fmt(trading.account?.buy_margin)}원</span><label>매도담보금</label><span>${fmt(trading.account?.sell_margin)}원</span><label>오버나잇담보금</label><span>${fmt(trading.account?.overnight_margin)}원</span></div></section>`;return head+`<section class="panel-page"><h2>차트</h2><div style="height:420px;border:1px solid #d7dde5;display:grid;place-items:center;color:#667085;text-align:center">Advanced Charts 승인 후 정식 차트 연결<br><small>현재 실시간 시세는 iTick 연동 중</small></div></section>`}
function renderAll(){renderSymbols();$('#dUser').textContent=profile?.login_id||'-';$('#mUser').textContent=profile?.login_id||'-';$('#dBalance').textContent=fmt(Number(trading.account?.cash_balance||0)+Number(trading.account?.realized_pnl||0));$('#desktopMain').innerHTML=genericPage();$('#orderPanel').innerHTML=page==='trade'?orderPanel():'<h3>VELTRO</h3><div style="color:#667085">거래 화면에서 주문 패널이 표시됩니다.</div>';$('#mobileMain').innerHTML=mobileContent();bindActions()}function renderMarketBits(){if(page==='trade'){const dl=$('#dLast');if(dl)dl.textContent=priceFmt(lastPrice());const db=$('#dBook');if(db)db.innerHTML=ladder();if(innerWidth<=820)$('#mobileMain').innerHTML=mobileContent()}}
function bindActions(){$$('[data-close]').forEach(b=>b.onclick=()=>closePosition(b.dataset.close));$$('[data-cancel]').forEach(b=>b.onclick=()=>cancelOrder(b.dataset.cancel));$$('[data-qty]').forEach(b=>b.onclick=()=>$('#orderQty').value=b.dataset.qty);$$('[data-side]').forEach(b=>b.onclick=()=>submitOrder(b.dataset.side));const os=$('#orderSymbol');if(os)os.onchange=async()=>{current=instruments.find(x=>x.symbol===os.value)||current;await loadQuote();renderAll()};const dep=$('#depBtn');if(dep)dep.onclick=depositReq;const wd=$('#wdBtn');if(wd)wd.onclick=withdrawReq;const iq=$('#iqBtn');if(iq)iq.onclick=inquiryReq;$$('[data-noti]').forEach(n=>n.onclick=()=>readNoti(n.dataset.noti));const p=$('#dPosTab');if(p)p.onclick=()=>{$('#dBottom').innerHTML=positionsTable();bindActions()};const o=$('#dOrderTab');if(o)o.onclick=()=>{$('#dBottom').innerHTML=ordersTable();bindActions()};const f=$('#dFillTab');if(f)f.onclick=()=>{$('#dBottom').innerHTML=fillsTable()}}
async function submitOrder(side){try{const type=$('#orderType').value,qty=Number($('#orderQty').value),price=Number($('#orderPrice').value||lastPrice());$('#orderMsg').textContent='주문 처리 중...';await post(TRADING,{action:'submit_order',symbol:current.symbol,side,order_type:type,qty,price});await loadTrading();renderAll();toast('주문이 처리되었습니다.')}catch(e){const m=$('#orderMsg');if(m)m.textContent='주문 실패: '+e.message;toast('주문 실패: '+e.message)}}async function closePosition(id){if(!confirm('현재가 기준으로 해당 포지션을 청산할까요?'))return;try{await post(TRADING,{action:'close_position',position_id:id,price:lastPrice()});await loadTrading();renderAll();toast('포지션이 청산되었습니다.')}catch(e){toast('청산 실패: '+e.message)}}async function cancelOrder(id){try{await post(TRADING,{action:'cancel_order',order_id:id});await loadTrading();renderAll();toast('주문을 취소했습니다.')}catch(e){toast('취소 실패: '+e.message)}}async function depositReq(){try{await post(ACCOUNT,{action:'deposit_request',amount:Number($('#depAmount').value),depositor_name:$('#depName').value});await loadAccount();renderAll();toast('입금신청이 완료되었습니다.')}catch(e){toast('신청 실패: '+e.message)}}async function withdrawReq(){try{await post(ACCOUNT,{action:'withdrawal_request',amount:Number($('#wdAmount').value)});await loadAccount();renderAll();toast('출금신청이 완료되었습니다.')}catch(e){toast('신청 실패: '+e.message)}}async function inquiryReq(){try{await post(ACCOUNT,{action:'inquiry_create',subject:$('#iqSubject').value,body:$('#iqBody').value});await loadAccount();renderAll();toast('문의가 등록되었습니다.')}catch(e){toast('등록 실패: '+e.message)}}async function readNoti(id){try{await post(ACCOUNT,{action:'notification_read',id:Number(id)});await loadAccount();renderAll()}catch{}}
function setPage(p){page=p;$$('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===p));renderAll();closeDrawer()}function closeDrawer(){$('#drawer').classList.add('hidden');$('#drawerMask').classList.add('hidden')}$$('[data-page]').forEach(b=>b.onclick=()=>setPage(b.dataset.page));$('#drawerBtn').onclick=()=>{$('#drawer').classList.remove('hidden');$('#drawerMask').classList.remove('hidden')};$('#drawerMask').onclick=closeDrawer;$$('#mTabs button').forEach(b=>b.onclick=()=>{mTab=b.dataset.tab;$$('#mTabs button').forEach(x=>x.classList.toggle('active',x===b));renderAll()});
$$('[data-order]').forEach(b=>b.onclick=()=>{if(b.dataset.order==='MARKET'||b.dataset.order==='LIMIT'){const qty=Number(prompt(`${b.dataset.order==='MARKET'?'시장가':'지정가'} 주문 수량`,'1'));if(!qty)return;const side=confirm('매수 주문이면 확인, 매도 주문이면 취소를 누르세요.')?'BUY':'SELL';const price=b.dataset.order==='LIMIT'?Number(prompt('주문가격',String(lastPrice()))):lastPrice();post(TRADING,{action:'submit_order',symbol:current.symbol,side,order_type:b.dataset.order,qty,price}).then(async()=>{await loadTrading();renderAll();toast('주문 처리 완료')}).catch(e=>toast('주문 실패: '+e.message))}else toast('해당 주문유형은 현재 백엔드 미지원입니다.')});function logout(){token='';profile=null;trading={account:null,positions:[],orders:[],fills:[]};accountData=null;poll&&clearInterval(poll);$('#app').classList.add('hidden');$('#login').classList.remove('hidden');$('#loginPw').value=''}$('#logoutBtn').onclick=logout;$('#mLogout').onclick=logout;
$('#loginBtn').onclick=async()=>{const id=$('#loginId').value.trim(),pw=$('#loginPw').value;$('#loginMsg').textContent='';try{const r=await post(AUTH,{action:'login',login_id:id,password:pw},false);if(!r.session?.access_token)throw Error('로그인 세션을 만들 수 없습니다.');token=r.session.access_token;profile=r.profile;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');await boot()}catch(e){$('#loginMsg').textContent=e.message==='invalid_credentials'?'아이디 또는 비밀번호를 확인하세요.':e.message}};$('#loginPw').onkeydown=e=>{if(e.key==='Enter')$('#loginBtn').click()};
</script></body></html>
