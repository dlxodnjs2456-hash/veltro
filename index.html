let token='',profile=null,trading={account:null,positions:[],orders:[],fills:[]},accountData=null,current=instruments[0],quote=null,page='trade',moneyTab='bank',mTab='quote',poll=null,tradeOpen=true;const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],fmt=n=>Number(n||0).toLocaleString('ko-KR'),priceFmt=(n,t=current.tick)=>{const d=t<.001?5:t<.01?3:t<1?2:0;return Number(n||0).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d})};function toast(s){const el=$('#toast');el.textContent=s;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),1900)}async function post(url,body,auth=true){const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json',apikey:K,Authorization:'Bearer '+(auth?token:K)},body:JSON.stringify(body)});let j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j.error||j.detail||'request_failed');return j}

function orderPanel(){return `<h3>신규주문</h3><label>종목</label><select id="orderSymbol">${instruments.map(x=>`<option value="${x.symbol}" ${x.symbol===current.symbol?'selected':''}>${x.symbol} · ${x.name}</option>`).join('')}</select><label>주문유형</label><select id="orderType"><option value="MARKET">시장가</option><option value="LIMIT">지정가</option></select><label>수량</label><input id="orderQty" type="number" min="1" value="1"><div class="quick">${[1,2,5,10].map(x=>`<button data-qty="${x}">${x}</button>`).join('')}</div><label>주문가격</label><input id="orderPrice" value="${lastPrice()||''}"><div class="trade-actions"><button class="buy" data-side="BUY">매수</button><button class="sell" data-side="SELL">매도</button></div><div id="orderMsg" class="order-msg"></div>`}
function moneyRows(){const ds=(accountData?.deposits||[]).map(x=>({t:x.created_at,k:x.request_type==='CRYPTO'?'코인입금':'계좌입금',a:x.amount,s:x.status,raw:x})),ws=(accountData?.withdrawals||[]).map(x=>({t:x.created_at,k:'출금',a:x.amount,s:x.status,raw:x}));return `<table class="table"><thead><tr><th>일시</th><th>구분</th><th>금액</th><th>상태</th><th>처리</th></tr></thead><tbody>${[...ds,...ws].sort((a,b)=>new Date(b.t)-new Date(a.t)).map(x=>`<tr><td>${new Date(x.t).toLocaleString('ko-KR')}</td><td>${x.k}</td><td>${fmt(x.a)}</td><td>${x.s}</td><td>${x.k!=='출금'&&x.s==='assigned'?`<button class="mini-btn" data-confirm-dep="${x.raw.id}">입금확인요청</button>`:'-'}</td></tr>`).join('')||'<tr><td colspan="5">내역이 없습니다.</td></tr>'}</tbody></table>`}
function moneyPage(){const a=accountData?.account||{},bal=Number(a.cash_balance||0)+Number(a.realized_pnl||0),tabs=`<div class="money-tabs">${[['bank','계좌입금'],['crypto','코인입금'],['withdraw','출금'],['history','신청내역']].map(([k,l])=>`<button data-money="${k}" class="${moneyTab===k?'active':''}">${l}</button>`).join('')}</div>`;let body='';if(moneyTab==='bank')body=`<div class="info-box">계좌입금은 신청 후 관리자가 입금계좌를 지정합니다. 계좌가 안내된 뒤 입금확인요청을 진행할 수 있습니다.</div><div class="form"><label>현재잔고</label><b>${fmt(bal)}원</b><label>입금금액</label><input id="depAmount" type="number"><label>입금자명</label><input id="depName" value="${profile?.account_holder||profile?.display_name||''}"><span></span><button id="depBtn" class="primary">입금신청</button></div>`;if(moneyTab==='crypto')body=`<div class="info-box">코인입금은 신청 후 관리자가 네트워크/입금주소/수량을 안내합니다.</div><div class="form"><label>현재잔고</label><b>${fmt(bal)}원</b><label>충전 반영금액</label><input id="cryptoAmount" type="number"><label>자산</label><select id="cryptoAsset"><option>USDT</option></select><label>네트워크</label><select id="cryptoNetwork"><option>TRC20</option></select><span></span><button id="cryptoBtn" class="primary">코인입금 신청</button></div>`;if(moneyTab==='withdraw')body=`<div class="info-box">등록된 본인 계좌로만 출금신청할 수 있습니다.</div><div class="form"><label>현재잔고</label><b>${fmt(bal)}원</b><label>출금금액</label><input id="wdAmount" type="number"><label>은행</label><b>${profile?.bank_name||'-'}</b><label>계좌번호</label><b>${profile?.bank_account||'-'}</b><label>예금주</label><b>${profile?.account_holder||'-'}</b><span></span><button id="wdBtn" class="primary">출금신청</button></div>`;if(moneyTab==='history')body=moneyRows();return `<section class="page-card"><h2>입출금</h2>${tabs}${body}</section>`}
function genericPage(){if(page==='money')return moneyPage();if(page==='history')return `<section class="page-card"><h2>거래내역</h2>${fillsTable()}</section>`;if(page==='alerts')return `<section class="page-card"><h2>알림</h2>${(accountData?.notifications||[]).map(x=>`<div style="padding:12px;border-bottom:1px solid #e5e7eb;cursor:pointer" data-noti="${x.id}"><b>${x.title}</b><div style="margin-top:5px;color:#667085">${x.body}</div><small>${new Date(x.created_at).toLocaleString('ko-KR')}</small>${!x.read_at?'<span style="float:right;color:#1687d9">읽지 않음</span>':''}</div>`).join('')||'알림이 없습니다.'}</section>`;if(page==='profile')return `<section class="page-card"><h2>회원정보</h2><div class="form"><label>아이디</label><b>${profile?.login_id||'-'}</b><label>이름</label><b>${profile?.display_name||'-'}</b><label>생년월일</label><span>${profile?.birth_date||'-'}</span><label>핸드폰</label><span>${profile?.phone||'-'}</span><label>이메일</label><span>${profile?.email||'-'}</span><label>은행</label><span>${profile?.bank_name||'-'}</span><label>계좌번호</label><span>${profile?.bank_account||'-'}</span><label>예금주</label><span>${profile?.account_holder||'-'}</span></div></section>`;if(page==='inquiry')return `<section class="page-card"><h2>1:1 문의</h2><div class="form"><label>제목</label><input id="iqSubject"><label>내용</label><textarea id="iqBody" rows="6"></textarea><span></span><button id="iqBtn" class="primary">문의등록</button></div><h3>문의내역</h3>${(accountData?.inquiries||[]).map(x=>`<div style="padding:10px;border-bottom:1px solid #eee"><b>${x.subject}</b><div>${x.body}</div></div>`).join('')||'문의내역이 없습니다.'}</section>`;return tradePage()}
function mobileContent(){if(page!=='trade')return genericPage();const head=`<div class="m-market"><b>${current.symbol}</b> · ${current.name}<span class="m-price mono">${priceFmt(lastPrice())}</span><div style="clear:both;color:#667085;font-size:11px;margin-top:4px">${current.exchange} · ${current.month}</div></div>`;if(mTab==='quote')return head+`<div class="book">${ladder()}</div>`;if(mTab==='positions')return head+positionsTable();if(mTab==='fills')return head+fillsTable();if(mTab==='info')return head+`<section class="page-card"><div class="form"><label>거래소</label><b>${current.exchange}</b><label>종목</label><b>${current.name}</b><label>계약월</label><span>${current.month}</span><label>틱 사이즈</label><span>${current.tick}</span><label>틱 가치</label><span>${fmt(current.tickValue)}원</span><label>매수담보금</label><span>${fmt(trading.account?.buy_margin)}원</span><label>매도담보금</label><span>${fmt(trading.account?.sell_margin)}원</span><label>오버나잇담보금</label><span>${fmt(trading.account?.overnight_margin)}원</span></div></section>`;return head+`<section class="page-card"><h2>차트</h2><div style="height:420px;border:1px solid #d7dde5;display:grid;place-items:center;color:#667085;text-align:center">Advanced Charts 승인 후 정식 차트 연결<br><small>현재 실시간 시세는 iTick 연동 중</small></div></section>`}
function renderAll(){renderTradeSub();$('#dUser').textContent=profile?.login_id||'-';$('#mUser').textContent=profile?.login_id||'-';$('#dBalance').textContent=fmt(Number(trading.account?.cash_balance||0)+Number(trading.account?.realized_pnl||0));$('#desktopGrid').classList.toggle('no-order',page!=='trade');$('#rightPanel').classList.toggle('hidden',page!=='trade');$('#desktopMain').innerHTML=genericPage();$('#orderPanel').innerHTML=page==='trade'?orderPanel():'';$('#mobileMain').innerHTML=mobileContent();$$('.nav-btn[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page));$('#tradeMenu').classList.toggle('active',page==='trade');bindActions()}function renderMarketBits(){if(page!=='trade')return;const dl=$('#dLast');if(dl)dl.textContent=priceFmt(lastPrice());const db=$('#dBook');if(db)db.innerHTML=ladder();if(innerWidth<=820)$('#mobileMain').innerHTML=mobileContent()}
function bindActions(){$$('[data-close]').forEach(b=>b.onclick=()=>closePosition(b.dataset.close));$$('[data-cancel]').forEach(b=>b.onclick=()=>cancelOrder(b.dataset.cancel));$$('[data-qty]').forEach(b=>b.onclick=()=>$('#orderQty').value=b.dataset.qty);$$('[data-side]').forEach(b=>b.onclick=()=>submitOrder(b.dataset.side));const os=$('#orderSymbol');if(os)os.onchange=async()=>{current=instruments.find(x=>x.symbol===os.value)||current;await loadQuote();renderAll()};$$('[data-money]').forEach(b=>b.onclick=()=>{moneyTab=b.dataset.money;renderAll()});const dep=$('#depBtn');if(dep)dep.onclick=depositReq;const cry=$('#cryptoBtn');if(cry)cry.onclick=cryptoReq;const wd=$('#wdBtn');if(wd)wd.onclick=withdrawReq;const iq=$('#iqBtn');if(iq)iq.onclick=inquiryReq;$$('[data-noti]').forEach(n=>n.onclick=()=>readNoti(n.dataset.noti));$$('[data-confirm-dep]').forEach(b=>b.onclick=()=>depositConfirm(b.dataset.confirmDep));const p=$('#dPosTab');if(p)p.onclick=()=>{$('#dBottom').innerHTML=positionsTable();bindActions()};const o=$('#dOrderTab');if(o)o.onclick=()=>{$('#dBottom').innerHTML=ordersTable();bindActions()};const f=$('#dFillTab');if(f)f.onclick=()=>{$('#dBottom').innerHTML=fillsTable()}}
async function submitOrder(side){try{const type=$('#orderType').value,qty=Number($('#orderQty').value),price=Number($('#orderPrice').value||lastPrice());$('#orderMsg').textContent='주문 처리 중...';await post(TRADING,{action:'submit_order',symbol:current.symbol,side,order_type:type,qty,price});await loadTrading();renderAll();toast('주문이 처리되었습니다.')}catch(e){toast('주문 실패: '+e.message)}}async function closePosition(id){if(!confirm('현재가 기준으로 해당 포지션을 청산할까요?'))return;try{await post(TRADING,{action:'close_position',position_id:id,price:lastPrice()});await loadTrading();renderAll();toast('포지션이 청산되었습니다.')}catch(e){toast('청산 실패: '+e.message)}}async function cancelOrder(id){try{await post(TRADING,{action:'cancel_order',order_id:id});await loadTrading();renderAll();toast('주문을 취소했습니다.')}catch(e){toast('취소 실패: '+e.message)}}async function depositReq(){try{await post(ACCOUNT,{action:'deposit_request',amount:Number($('#depAmount').value),depositor_name:$('#depName').value});await loadAccount();moneyTab='history';renderAll();toast('계좌입금 신청이 완료되었습니다.')}catch(e){toast('신청 실패: '+e.message)}}async function cryptoReq(){try{await post(ACCOUNT,{action:'crypto_deposit_request',amount:Number($('#cryptoAmount').value),asset:$('#cryptoAsset').value,network:$('#cryptoNetwork').value});await loadAccount();moneyTab='history';renderAll();toast('코인입금 신청이 완료되었습니다.')}catch(e){toast('신청 실패: '+e.message)}}async function depositConfirm(id){try{await post(ACCOUNT,{action:'deposit_confirm_request',id:Number(id)});await loadAccount();renderAll();toast('입금확인요청을 보냈습니다.')}catch(e){toast('처리 실패: '+e.message)}}async function withdrawReq(){try{await post(ACCOUNT,{action:'withdrawal_request',amount:Number($('#wdAmount').value)});await loadAccount();moneyTab='history';renderAll();toast('출금신청이 완료되었습니다.')}catch(e){toast('신청 실패: '+e.message)}}async function inquiryReq(){try{await post(ACCOUNT,{action:'inquiry_create',subject:$('#iqSubject').value,body:$('#iqBody').value});await loadAccount();renderAll();toast('문의가 등록되었습니다.')}catch(e){toast('등록 실패: '+e.message)}}async function readNoti(id){try{await post(ACCOUNT,{action:'notification_read',id:Number(id)});await loadAccount();renderAll()}catch{}}
function setPage(p){page=p;if(p==='trade')tradeOpen=true;renderAll();closeDrawer()}$('#tradeMenu').onclick=()=>{tradeOpen=!tradeOpen;page='trade';renderAll()};$$('.nav-btn[data-page]').forEach(b=>b.onclick=()=>setPage(b.dataset.page));$('#mTradeToggle').onclick=()=>{$('#mTradeSub').classList.toggle('hidden')};$$('#drawer [data-page]').forEach(b=>b.onclick=()=>setPage(b.dataset.page));function closeDrawer(){$('#drawer').classList.add('hidden');$('#drawerMask').classList.add('hidden')}$('#drawerBtn').onclick=()=>{$('#drawer').classList.remove('hidden');$('#drawerMask').classList.remove('hidden')};$('#drawerMask').onclick=closeDrawer;$$('#mTabs button').forEach(b=>b.onclick=()=>{mTab=b.dataset.tab;$$('#mTabs button').forEach(x=>x.classList.toggle('active',x===b));renderAll()});$$('[data-order]').forEach(b=>b.onclick=()=>{if(b.dataset.order==='MARKET'||b.dataset.order==='LIMIT'){const qty=Number(prompt(`${b.dataset.order==='MARKET'?'시장가':'지정가'} 주문 수량`,'1'));if(!qty)return;const side=confirm('매수 주문이면 확인, 매도 주문이면 취소를 누르세요.')?'BUY':'SELL';const price=b.dataset.order==='LIMIT'?Number(prompt('주문가격',String(lastPrice()))):lastPrice();post(TRADING,{action:'submit_order',symbol:current.symbol,side,order_type:b.dataset.order,qty,price}).then(async()=>{await loadTrading();renderAll();toast('주문 처리 완료')}).catch(e=>toast('주문 실패: '+e.message))}else toast('해당 주문유형은 백엔드 기능 구현 후 연결됩니다.')});function logout(){token='';profile=null;trading={account:null,positions:[],orders:[],fills:[]};accountData=null;poll&&clearInterval(poll);$('#app').classList.add('hidden');$('#login').classList.remove('hidden');$('#loginPw').value=''}$('#logoutBtn').onclick=logout;$('#mLogout').onclick=logout;
$('#loginBtn').onclick=async()=>{const id=$('#loginId').value.trim(),pw=$('#loginPw').value;$('#loginMsg').textContent='';try{const r=await post(AUTH,{action:'login',login_id:id,password:pw},false);if(!r.session?.access_token)throw Error('로그인 세션을 만들 수 없습니다.');token=r.session.access_token;profile=r.profile;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');await boot()}catch(e){$('#loginMsg').textContent=e.message==='invalid_credentials'?'아이디 또는 비밀번호를 확인하세요.':e.message}};$('#loginPw').onkeydown=e=>{if(e.key==='Enter')$('#loginBtn').click()};
</script></body></html>
