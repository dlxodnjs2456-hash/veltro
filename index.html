90deg,#edf5ff 0,#edf5ff 65%,#fff 65%)}.bid{background:linear-gradient(90deg,#fff 0,#fff 35%,#fff0f0 35%)}.now{background:#fff200!important;font-weight:900}.summary{border-left:1px solid var(--line);padding:12px;font-size:12px}.summary h3{margin:0 0 10px;font-size:13px}.kv{display:grid;grid-template-columns:1fr auto;gap:8px 10px;padding:4px 0}.bottom{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:9px 8px;border-bottom:1px solid #e5e7eb;text-align:center;white-space:nowrap}.table th{background:#f7f9fb;color:#667085}.mini{height:28px;border:1px solid #adb7c2;border-radius:5px;background:#fff;padding:0 9px;cursor:pointer}.danger{background:var(--buy);border-color:var(--buy);color:#fff}.order{height:100%;padding:13px}.order h3{margin:0 0 12px;font-size:15px}.order label{display:block;color:var(--muted);font-size:11px;margin:9px 0 4px}.order input,.order select{width:100%;height:36px;border:1px solid #c9d1db;border-radius:6px;padding:0 8px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:5px}.quick button{height:30px;border:1px solid #c9d1db;background:#fff;border-radius:5px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.actions button{height:46px;border:0;border-radius:7px;color:#fff;font-weight:900}.buy{background:var(--buy)}.sell{background:var(--sell)}.order-msg{min-height:18px;font-size:11px;color:var(--muted);margin-top:8px}.page{min-height:calc(100vh - 70px);padding:18px;background:#fff;border:1px solid var(--line)}.page h2{margin:0 0 16px;font-size:18px}.page h3{margin:24px 0 10px;font-size:14px}.form{max-width:680px;display:grid;grid-template-columns:160px minmax(220px,1fr);gap:10px;align-items:center}.form input,.form select,.form textarea{min-height:38px;border:1px solid #c9d1db;border-radius:6px;padding:7px 9px}.primary{height:36px;border:0;border-radius:6px;background:var(--brand);color:#fff;padding:0 16px}.secondary{height:36px;border:1px solid #c9d1d <script>
const U='https://mzjkvakigwtlibwlslhq.supabase.co',K='sb_publishable_E3h8Gqx-RQqvAxiNXvBhKQ_WZIfGd4t';
const AUTH=U+'/functions/v1/auth-api',TRADING=U+'/functions/v1/trading-api',ACCOUNT=U+'/functions/v1/account-api',WITHDRAW=U+'/functions/v1/withdrawal-api',MARKET=U+'/functions/v1/market-data-api';
const INS=[
{symbol:'NQU26',code:'NQ',name:'E-mini Nasdaq100',exchange:'CME',month:'202609',tick:.25,tickValue:6290},
{symbol:'ESU26',code:'ES',name:'E-mini S&P 500',exchange:'CME',month:'202609',tick:.25,tickValue:17300},
{symbol:'CLV26',code:'CL',name:'Crude Oil',exchange:'NYMEX',month:'202610',tick:.01,tickValue:13840},
{symbol:'GCZ26',code:'GC',name:'Gold',exchange:'COMEX',month:'202612',tick:.1,tickValue:13840},
{symbol:'SIU26',code:'SI',name:'Silver',exchange:'COMEX',month:'202609',tick:.005,tickValue:34600},
{symbol:'6JU26',code:'6J',name:'Japanese Yen',exchange:'CME',month:'202609',tick:.5,tickValue:8650},
{symbol:'HSIQ26',code:'HSI',name:'Hang Seng Index',exchange:'HKEX',month:'202608',tick:1,tickValue:8831}
];
let token='',refreshToken='',profile=null,trading={account:null,positions:[],orders:[],fills:[]},dash={profile:null,account:null,deposits:[],withdrawals:[],notifications:[],notices:[],inquiries:[]},cur=INS[0],quote=null,page='trade',tab='quote',moneyTab='bank',chart=null,tf=1;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)], fmt=n=>Number(n||0).toLocaleString('ko-KR');
function toast(t){const e=$('#toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),1900)}
async function api(url,body,auth=true){const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json',apikey:K,Authorization:'Bearer '+(auth?token:K)},body:JSON.stringify(body)});let j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j.error||j.detail||'request_failed');return j}
function dec(i=cur){return i.tick<.001?5:i.tick<.01?3:i.tick<1?2:0}function pf(n,i=cur){return Number(n||0).toLocaleString('en-US',{minimumFractionDigits:dec(i),maximumFractionDigits:dec(i)})}
function lp(){return Number(quote?.ld||quote?.last||quote?.price||0)}function bal(){const a=trading.account||dash.account||{};return Number(a.cash_balance||0)+Number(a.realized_pnl||0)}
function region(i=cur){return i.code==='HSI'?'HK':'US'}
async function loadTrading(){trading=await api(TRADING,{action:'account'})}async function loadDash(){dash=await api(ACCOUNT,{action:'dashboard'});profile=dash.profile}async function loadQuote(){const r=await api(MARKET,{action:'quote',region:region(),code:cur.code});quote=r.quote||r.data||r}
async function syncAll(render=true){await Promise.all([loadTrading(),loadDash(),loadQuote()]);if(render)renderAll()}
function ladder(){const x=lp();if(!x)return '<div style="padding:50px;text-align:center;color:#98a2b3">시세 연결 중...</div>';let h='';for(let i=6;i>=-6;i--){const p=Math.round((x+i*cur.tick)/cur.tick)*cur.tick,c=i>0?'ask':i<0?'bid':'now';h+=`<div class="book-row ${c}"><div class="q">${40+Math.floor(Math.random()*160)}</div><div class="p mono">${pf(p)}</div><div class="q">${3+Math.floor(Math.random()*65)}</div></div>`}return h}
function pnl(p){const i=INS.find(x=>x.symbol===p.symbol)||cur;if(p.symbol!==cur.symbol)return null;const ticks=(p.side==='BUY'?lp()-Number(p.avg_entry):Number(p.avg_entry)-lp())/i.tick;return Math.round(ticks*i.tickValue*Number(p.qty))}
function positions(){const r=(trading.positions||[]).map(p=>{const i=INS.find(x=>x.symbol===p.symbol)||cur,v=pnl(p);return `<tr><td>${p.side==='BUY'?'매수':'매도'}</td><td>${p.symbol}</td><td>${p.qty}</td><td>${pf(p.avg_entry,i)}</td><td>${p.symbol===cur.symbol?pf(lp(),i):'-'}</td><td class="${v==null?'':v>=0?'red':'blue'}">${v==null?'-':fmt(v)}</td><td><button class="mini danger" data-close="${p.id}">청산</button></td></tr>`}).join('');return `<table class="table"><thead><tr><th>구분</th><th>종목</th><th>수량</th><th>평단가</th><th>현재가</th><th>평가손익</th><th>기능</th></tr></thead><tbody>${r||'<tr><td colspan="7" style="height:80px;color:#98a2b3">보유 포지션이 없습니다.</td></tr>'}</tbody></table>`}
function orders(){const r=(trading.orders||[]).filter(x=>x.status==='OPEN').map(o=>`<tr><td>${o.symbol}</td><td>${o.side}</td><td>${o.order_type}</td><td>${o.qty}</td><td>${o.order_price?pf(o.order_price,INS.find(i=>i.symbol===o.symbol)||cur):'-'}</td><td><button class="mini" data-cancel="${o.id}">취소</button></td></tr>`).join('');return `<table class="table"><thead><tr><th>종목</th><th>구분</th><th>유형</th><th>수량</th><th>가격</th><th>기능</th></tr></thead><tbody>${r||'<tr><td colspan="6" style="height:80px;color:#98a2b3">미체결 주문이 없습니다.</td></tr>'}</tbody></table>`}
function fills(){const r=(trading.fills||[]).map(x=>`<tr><td>${new Date(x.filled_at).toLocaleString('ko-KR')}</td><td>${x.symbol}</td><td>${x.side}</td><td>${x.qty}</td><td>${pf(x.fill_price,INS.find(i=>i.symbol===x.symbol)||cur)}</td><td>${x.fill_type}</td></tr>`).join('');return `<table class="table"><thead><tr><th>시간</th><th>종목</th><th>구분</th><th>수량</th><th>체결가</th><th>유형</th></tr></thead><tbody>${r||'<tr><td colspan="6">체결내역이 없습니다.</td></tr>'}</tbody></table>`}
function symbolMenus(){const h=INS.map(i=>`<button class="sub ${i.symbol===cur.symbol?'active':''}" data-symbol="${i.symbol}"><b>${i.symbol}</b><small>${i.name}</small></button>`).join('');$('#symbols').innerHTML=h;$('#mSymbols').innerHTML=h}
function tradePage(){const a=trading.account||{};let center='';if(tab==='quote')center=`<section class="center"><div class="book">${ladder()}</div><aside class="summary"><h3>계좌/종목 정보</h3><div class="kv"><span>잔고</span><b>${fmt(bal())}원</b><span>매수담보금</span><b>${fmt(a.buy_margin)}원</b><span>매도담보금</span><b>${fmt(a.sell_margin)}원</b><span>오버나잇</span><b>${a.overnight_enabled?'적용':'미적용'}</b><span>틱사이즈</span><b>${cur.tick}</b><span>틱가치</span><b>${fmt(cur.tickValue)}원</b></div><button id="overnight" class="secondary" style="margin-top:12px">${a.overnight_enabled?'오버나잇 해제':'오버나잇 적용'}</button></aside></section>`;else if(tab==='positions')center=`<section class="card" style="overflow:auto">${positions()}</section>`;else if(tab==='orders')center=`<section class="card" style="overflow:auto">${orders()}</section>`;else if(tab==='fills')center=`<section class="card" style="overflow:auto">${fills()}</section>`;else if(tab==='info')center=`<section class="page"><div class="form"><label>거래소</label><b>${cur.exchange}</b><label>종목</label><b>${cur.name}</b><label>계약월</label><span>${cur.month}</span><label>틱 사이즈</label><span>${cur.tick}</span><label>틱 가치</label><span>${fmt(cur.tickValue)}원</span><label>매수담보금</label><span>${fmt(a.buy_margin)}원</span><label>매도담보금</label><span>${fmt(a.sell_margin)}원</span><label>오버나잇담보금</label><span>${fmt(a.overnight_margin)}원</span></div></section>`;else center=`<section class="card chart-wrap"><div class="chart-tools"><select id="tf"><option value="1">1분</option><option value="2">5분</option><option value="3">15분</option><option value="4">30분</option><option value="5">1시간</option></select><button id="chartReload">새로고침</button><span id="chartState" style="font-size:11px;color:#667085">iTick 실시간 누적</span></div><div id="chartBox"></div></section>`;
return `<div class="trade"><div class="market-head"><div><b>${cur.symbol} · ${cur.name}</b><small>${cur.exchange} · ${cur.month}</small></div><div class="last mono">${pf(lp())}</div></div><div class="tabs">${[['quote','호가'],['positions','포지션'],['orders','미체결'],['fills','체결'],['chart','차트'],['info','종목정보']].map(([k,l])=>`<button data-tab="${k}" class="${tab===k?'active':''}">${l}</button>`).join('')}</div>${center}<section class="bottom">${positions()}</section></div>`}

const SESSION_KEY='veltro_wts_session_v1';
function persistSession(session,prof){
  token=String(session?.access_token||token||'');
  refreshToken=String(session?.refresh_token||refreshToken||'');
  if(prof) profile=prof;
  if(token&&refreshToken){localStorage.setItem(SESSION_KEY,JSON.stringify({access_token:token,refresh_token:refreshToken,profile:profile||null,saved_at:Date.now()}));}
}
function clearPersistedSession(){localStorage.removeItem(SESSION_KEY);token='';refreshToken='';profile=null;}
async function renewSession(){
  if(!refreshToken)return false;
  try{
    const r=await fetch(U+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'content-type':'application/json',apikey:K},body:JSON.stringify({refresh_token:refreshToken})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j?.access_token)return false;
    persistSession(j,profile);return true;
  }catch{return false}
}
async function api(url,body,auth=true,retry=true){
  const doFetch=()=>fetch(url,{method:'POST',headers:{'content-type':'application/json',apikey:K,Authorization:'Bearer '+(auth?token:K)},body:JSON.stringify(body)});
  let r=await doFetch();
  if(auth&&r.status===401&&retry&&await renewSession())r=await doFetch();
  let j={};try{j=await r.json()}catch{}
  if(!r.ok)throw Error(j.error||j.detail||'request_failed');
  return j;
}
async function restoreSession(){
  let saved=null;try{saved=JSON.parse(localStorage.getItem(SESSION_KEY)||'null')}catch{}
  if(!saved?.access_token||!saved?.refresh_token)return false;
  token=String(saved.access_token);refreshToken=String(saved.refresh_token);profile=saved.profile||null;
  try{
    $('#login').classList.add('hidden');$('#app').classList.remove('hidden');
    await syncAll(true);startTimers();return true;
  }catch(e){
    if(await renewSession()){
      try{await syncAll(true);startTimers();return true}catch{}
    }
    clearPersistedSession();$('#app').classList.add('hidden');$('#login').classList.remove('hidden');return false;
  }
}

let pollStop=false,quoteTimer=null,accountTimer=null,chartTimer=null;
function stopPollers(){
  pollStop=true;
  if(quoteTimer)clearTimeout(quoteTimer);
  if(accountTimer)clearTimeout(accountTimer);
  if(chartTimer)clearTimeout(chartTimer);
  quoteTimer=accountTimer=chartTimer=null;
}
async function quoteLoop(){
  if(pollStop||!token)return;
  if(!document.hidden){
    try{
      const beforeLast=lp(),beforeTs=Number(quote?.t||0);
      await loadQuote();
      const changed=lp()!==beforeLast||Number(quote?.t||0)!==beforeTs;
      if(page==='trade'&&changed)refreshLiveTrade();
    }catch(e){console.warn('quote loop',e)}
  }
  if(!pollStop&&token)quoteTimer=setTimeout(quoteLoop,1200);
}
async function accountLoop(){
  if(pollStop||!token)return;
  if(!document.hidden){
    try{
      await Promise.all([loadTrading(),loadDash()]);
      await pollOpenOrderQuotes();
      if(page!=='trade'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))renderAll();
    }catch(e){console.warn('account loop',e)}
  }
  if(!pollStop&&token)accountTimer=setTimeout(accountLoop,5000);
}
async function chartLoop(){
  if(pollStop||!token)return;
  if(page==='trade'&&tab==='chart'&&!document.hidden){
    try{await drawChart()}catch(e){console.warn('chart loop',e)}
  }
  if(!pollStop&&token)chartTimer=setTimeout(chartLoop,30000);
}
function startTimers(){
  stopPollers();
  pollStop=false;
  quoteLoop();
  accountLoop();
  chartLoop();
