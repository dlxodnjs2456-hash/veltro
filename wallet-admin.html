<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VELTRO NETWORK FORWARDING ADMIN</title><style>:root{--bg:#07111d;--panel:#0c1c2c;--line:#24445e;--text:#eef7ff;--muted:#8ea8bc;--blue:#2f8cff;--cyan:#4ec5ff;--bad:#ff6c7b}*{box-sizing:border-box}body{margin:0;background:#07111d;color:var(--text);font-family:Arial,"Malgun Gothic",sans-serif}.wrap{max-width:1400px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:22px;font-weight:900}.brand b{color:var(--cyan)}.card{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat{padding:14px;border:1px solid #1b3952;border-radius:12px;background:#0a1725}.stat small{color:var(--muted)}.stat strong{display:block;font-size:24px;margin-top:5px}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:9px;border-bottom:1px solid #17334a;text-align:left;white-space:nowrap}.table th{color:var(--muted)}button,input,select,textarea{font:inherit}.btn{height:34px;border-radius:7px;border:1px solid var(--line);background:#10283d;color:white;padding:0 10px;cursor:pointer}.primary{background:#1677e8;border-color:#1677e8}.danger{background:#7a2631;border-color:#a83b49}.login{min-height:100vh;display:grid;place-items:center}.loginbox{width:min(400px,94vw);padding:26px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}.loginbox input{width:100%;height:44px;background:#071421;border:1px solid var(--line);border-radius:8px;color:#fff;padding:0 11px;margin:6px 0}.hidden{display:none!important}.edit input,.edit select{width:120px;height:32px;background:#071421;border:1px solid var(--line);color:#fff;border-radius:6px;padding:0 7px}.msg{color:#ff9da7;font-size:12px;min-height:18px;margin-top:7px}.report-form{display:grid;grid-template-columns:180px 160px 1fr 160px 160px auto;gap:8px;align-items:start}.report-form input,.report-form select,.report-form textarea{width:100%;background:#071421;border:1px solid var(--line);color:#fff;border-radius:7px;padding:8px}.report-form textarea{min-height:80px;resize:vertical}.report-list{margin-top:14px}.report-item{border-top:1px solid #17334a;padding:12px 0}.report-item:first-child{border-top:0}@media(max-width:1100px){.report-form{grid-template-columns:1fr 1fr}.report-form textarea{grid-column:1/-1}.grid{grid-template-columns:1fr 1fr}.wrap{padding:12px}.table{font-size:11px}}</style></head><body><div id="login" class="login"><div class="loginbox"><div class="brand">VEL<b>TRO</b> NETWORK FORWARDING ADMIN</div><p style="color:#8ea8bc">Asset Connection & Forwarding Service</p><p style="color:#8ea8bc;font-size:13px">관리자 계정으로 로그인하세요.</p><input id="id" placeholder="아이디"><input id="pw" type="password" placeholder="비밀번호"><button id="loginBtn" class="btn primary" style="width:100%;height:44px;margin-top:7px">로그인</button><div id="loginMsg" class="msg"></div></div></div><div id="app" class="hidden"><div class="wrap"><div class="top"><div><div class="brand">VEL<b>TRO</b> NETWORK FORWARDING ADMIN</div><div style="color:#8ea8bc;font-size:12px;margin-top:4px">Asset Connection & Forwarding Service</div></div><button id="logout" class="btn">로그아웃</button></div><div id="body"></div></div></div><script>const U='https://mzjkvakigwtlibwlslhq.supabase.co',K='sb_publishable_E3h8Gqx-RQqvAxiNXvBhKQ_WZIfGd4t',AUTH=U+'/functions/v1/auth-api',W=U+'/functions/v1/wallet-api';let token='';const $=s=>document.querySelector(s),fmt=v=>Number(v||0).toLocaleString('ko-KR'),date=v=>v?new Date(v).toLocaleString('ko-KR'):'-';async function api(url,body,auth=true){const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json',apikey:K,...(auth&&token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify(body)}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'request_failed');return j}async function load(){const [a,r,rp]=await Promise.all([api(W,{action:'admin_list'}),api(W,{action:'admin_requests'}),api(W,{action:'admin_reports'})]);const items=a.items||[],reqs=(r.items||[]).filter(x=>x.status==='PENDING'),reports=rp.items||[],active=items.filter(x=>x.wallet_status==='ACTIVE').length,total=items.reduce((s,x)=>s+Number(x.wallet_balance||0),0);$('#body').innerHTML=`<div class="grid"><div class="stat"><small>연동 계정</small><strong>${items.length}</strong></div><div class="stat"><small>연동중</small><strong>${active}</strong></div><div class="stat"><small>승인대기</small><strong>${reqs.length}</strong></div><div class="stat"><small>총 연동자산</small><strong>${fmt(total)}원</strong></div></div><div class="card"><h3>Connection Requests</h3><div style="overflow:auto"><table class="table"><thead><tr><th>ID</th><th>이름</th><th>신청일</th><th>요청기간</th><th>처리</th></tr></thead><tbody>${reqs.map(x=>`<tr><td>${x.profiles?.login_id||'-'}</td><td>${x.profiles?.display_name||'-'}</td><td>${date(x.requested_at)}</td><td><input id="d${x.id}" value="${x.requested_days||30}" style="width:70px;height:30px;background:#071421;border:1px solid #24445e;color:#fff;border-radius:6px;padding:0 6px">일</td><td><button class="btn primary" data-ap="${x.id}">승인</button> <button class="btn danger" data-rj="${x.id}">거절</button></td></tr>`).join('')||'<tr><td colspan="5">대기 요청이 없습니다.</td></tr>'}</tbody></table></div></div><div class="card"><h3>Linked Account Management</h3><div style="overflow:auto"><table class="table edit"><thead><tr><th>회원</th><th>상태</th><th>연동자산</th><th>충전금액</th><th>자산 증가액</th><th>수익률</th><th>만료일</th><th>저장</th></tr></thead><tbody>${items.map(x=>`<tr><td>${x.profiles?.login_id||'-'}<br><small style="color:#8ea8bc">${x.profiles?.display_name||''}</small></td><td><select id="s_${x.user_id}">${['UNLINKED','PENDING','ACTIVE','EXPIRED','DISCONNECTED','SUSPENDED'].map(v=>`<option ${v===x.wallet_status?'selected':''}>${v}</option>`).join('')}</select></td><td><input id="b_${x.user_id}" value="${x.wallet_balance||0}"></td><td><input id="p_${x.user_id}" value="${x.linked_principal||0}"></td><td>${Number(x.growth_amount||0)>=0?'+':''}${fmt(x.growth_amount)}원</td><td>${Number(x.return_rate||0)>=0?'+':''}${Number(x.return_rate||0).toFixed(2)}%</td><td><input id="e_${x.user_id}" type="datetime-local" value="${x.expires_at?new Date(x.expires_at).toISOString().slice(0,16):''}"></td><td><button class="btn primary" data-save="${x.user_id}">저장</button></td></tr>`).join('')||'<tr><td colspan="8">연동 계정이 없습니다.</td></tr>'}</tbody></table></div></div><div class="card"><h3>수익일정 / 수익 리포트 등록</h3><div class="report-form"><select id="ru"><option value="">회원 선택</option>${items.map(x=>`<option value="${x.user_id}">${x.profiles?.login_id||'-'} · ${x.profiles?.display_name||''}</option>`).join('')}</select><input id="rd" type="date" value="${new Date().toISOString().slice(0,10)}"><input id="rt" placeholder="리포트 제목"><input id="ra" inputmode="numeric" placeholder="수익금액(선택)"><input id="rb" inputmode="numeric" placeholder="기준 자산(선택)"><button id="reportAdd" class="btn primary">등록</button><textarea id="rc" placeholder="수익 리포트 내용을 작성하세요."></textarea></div><div id="rmsg" class="msg"></div><div class="report-list">${reports.map(x=>`<div class="report-item"><b>${x.report_date} · ${x.profiles?.login_id||'-'} · ${x.title}</b><div style="color:#a9bfd0;margin-top:6px;white-space:pre-wrap">${x.content||''}</div><div style="margin-top:6px;color:#8ea8bc;font-size:12px">${x.profit_amount!=null?'수익 '+fmt(x.profit_amount)+'원 · ':''}${x.asset_balance!=null?'기준자산 '+fmt(x.asset_balance)+'원 · ':''}${date(x.created_at)} <button class="btn danger" data-rdel="${x.id}" style="margin-left:8px">삭제</button></div></div>`).join('')||'<div style="color:#8ea8bc">등록된 수익 리포트가 없습니다.</div>'}</div></div>`;document.querySelectorAll('[data-ap]').forEach(b=>b.onclick=async()=>{await api(W,{action:'admin_approve',id:Number(b.dataset.ap),days:Number($('#d'+b.dataset.ap).value||30)});load()});document.querySelectorAll('[data-rj]').forEach(b=>b.onclick=async()=>{await api(W,{action:'admin_reject',id:Number(b.dataset.rj)});load()});document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{const u=b.dataset.save,e=$('#e_'+u).value;await api(W,{action:'admin_update',user_id:u,wallet_status:$('#s_'+u).value,wallet_balance:Number($('#b_'+u).value||0),linked_principal:Number($('#p_'+u).value||0),expires_at:e?new Date(e).toISOString():null,description:'Network Forwarding 관리자 정보 수정'});load()});$('#reportAdd').onclick=async()=>{try{$('#rmsg').textContent='';const uid=$('#ru').value;if(!uid)throw Error('회원을 선택하세요.');await api(W,{action:'admin_report_create',user_id:uid,report_date:$('#rd').value,title:$('#rt').value,content:$('#rc').value,profit_amount:$('#ra').value===''?null:Number($('#ra').value),asset_balance:$('#rb').value===''?null:Number($('#rb').value)});load()}catch(e){$('#rmsg').textContent=e.message}};document.querySelectorAll('[data-rdel]').forEach(b=>b.onclick=async()=>{if(confirm('이 수익 리포트를 삭제할까요?')){await api(W,{action:'admin_report_delete',id:Number(b.dataset.rdel)});load()}})}function logout(){localStorage.removeItem('veltro_wallet_admin');token='';location.reload()}$('#loginBtn').onclick=async()=>{try{$('#loginMsg').textContent='';const r=await api(AUTH,{action:'login',login_id:$('#id').value.trim(),password:$('#pw').value},false);if(r.profile?.role!=='admin')throw Error('관리자 계정이 아닙니다.');token=r.session.access_token;localStorage.setItem('veltro_wallet_admin',token);$('#login').classList.add('hidden');$('#app').classList.remove('hidden');await load()}catch(e){$('#loginMsg').textContent=e.message}};$('#pw').onkeydown=e=>{if(e.key==='Enter')$('#loginBtn').click()};$('#logout').onclick=logout;const t=localStorage.getItem('veltro_wallet_admin');if(t){token=t;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');load().catch(()=>logout())}</script></body></html>
