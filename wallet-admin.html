<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VELTRO WALLET ADMIN</title><style>:root{--bg:#07111d;--panel:#0c1c2c;--line:#24445e;--text:#eef7ff;--muted:#8ea8bc;--blue:#2f8cff;--cyan:#4ec5ff;--bad:#ff6c7b}*{box-sizing:border-box}body{margin:0;background:#07111d;color:var(--text);font-family:Arial,"Malgun Gothic",sans-serif}.wrap{max-width:1400px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:22px;font-weight:900}.brand b{color:var(--cyan)}.card{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:14px;border:1px solid #1b3952;border-radius:12px;background:#0a1725}.stat small{color:var(--muted)}.stat strong{display:block;font-size:24px;margin-top:5px}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:9px;border-bottom:1px solid #17334a;text-align:left;white-space:nowrap}.table th{color:var(--muted)}button,input,select{font:inherit}.btn{height:34px;border-radius:7px;border:1px solid var(--line);background:#10283d;color:white;padding:0 10px;cursor:pointer}.primary{background:#1677e8;border-color:#1677e8}.danger{background:#7a2631;border-color:#a83b49}.login{min-height:100vh;display:grid;place-items:center}.loginbox{width:min(400px,94vw);padding:26px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}.loginbox input{width:100%;height:44px;background:#071421;border:1px solid var(--line);border-radius:8px;color:#fff;padding:0 11px;margin:6px 0}.hidden{display:none!important}.edit input,.edit select{width:120px;height:32px;background:#071421;border:1px solid var(--line);color:#fff;border-radius:6px;padding:0 7px}.msg{color:#ff9da7;font-size:12px;min-height:18px;margin-top:7px}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.wrap{padding:12px}.table{font-size:11px}}</style></head><body><div id="login" class="login"><div class="loginbox"><div class="brand">VEL<b>TRO</b> WALLET ADMIN</div><p style="color:#8ea8bc">관리자 계정으로 로그인하세요.</p><input id="id" placeholder="아이디"><input id="pw" type="password" placeholder="비밀번호"><button id="loginBtn" class="btn primary" style="width:100%;height:44px;margin-top:7px">로그인</button><div id="loginMsg" class="msg"></div></div></div><div id="app" class="hidden"><div class="wrap"><div class="top"><div class="brand">VEL<b>TRO</b> WALLET ADMIN</div><button id="logout" class="btn">로그아웃</button></div><div id="body"></div></div></div><script>const U='https://mzjkvakigwtlibwlslhq.supabase.co',K='sb_publishable_E3h8Gqx-RQqvAxiNXvBhKQ_WZIfGd4t',AUTH=U+'/functions/v1/auth-api',W=U+'/functions/v1/wallet-api';let token='';const $=s=>document.querySelector(s),fmt=v=>Number(v||0).toLocaleString('ko-KR'),date=v=>v?new Date(v).toLocaleString('ko-KR'):'-';async function api(url,body,auth=true){const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json',apikey:K,...(auth&&token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify(body)}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'request_failed');return j}function st(s){return({UNLINKED:'미연동',PENDING:'승인대기',ACTIVE:'연동중',EXPIRED:'만료',DISCONNECTED:'해제',SUSPENDED:'정지'})[s]||s}async function load(){const [a,r]=await Promise.all([api(W,{action:'admin_list'}),api(W,{action:'admin_requests'})]);const items=a.items||[],reqs=(r.items||[]).filter(x=>x.status==='PENDING'),active=items.filter(x=>x.wallet_status==='ACTIVE').length,total=items.reduce((s,x)=>s+Number(x.wallet_balance||0),0);$('#body').innerHTML=`<div class="grid"><div class="stat"><small>월렛 계정</small><strong>${items.length}</strong></div><div class="stat"><small>연동중</small><strong>${active}</strong></div><div class="stat"><small>승인대기</small><strong>${reqs.length}</strong></div><div class="stat"><small>총 월렛잔고</small><strong>${fmt(total)}원</strong></div></div><div class="card"><h3>연동 승인대기</h3><div style="overflow:auto"><table class="table"><thead><tr><th>ID</th><th>이름</th><th>신청일</th><th>요청기간</th><th>처리</th></tr></thead><tbody>${reqs.map(x=>`<tr><td>${x.profiles?.login_id||'-'}</td><td>${x.profiles?.display_name||'-'}</td><td>${date(x.requested_at)}</td><td><input id="d${x.id}" value="${x.requested_days||30}" style="width:70px;height:30px;background:#071421;border:1px solid #24445e;color:#fff;border-radius:6px;padding:0 6px">일</td><td><button class="btn primary" data-ap="${x.id}">승인</button> <button class="btn danger" data-rj="${x.id}">거절</button></td></tr>`).join('')||'<tr><td colspan="5">대기 요청이 없습니다.</td></tr>'}</tbody></table></div></div><div class="card"><h3>월렛 회원관리</h3><div style="overflow:auto"><table class="table edit"><thead><tr><th>회원</th><th>상태</th><th>월렛잔고</th><th>연동원금</th><th>누적손익</th><th>수익률</th><th>만료일</th><th>저장</th></tr></thead><tbody>${items.map(x=>`<tr><td>${x.profiles?.login_id||'-'}<br><small style="color:#8ea8bc">${x.profiles?.display_name||''}</small></td><td><select id="s_${x.user_id}">${['UNLINKED','PENDING','ACTIVE','EXPIRED','DISCONNECTED','SUSPENDED'].map(v=>`<option ${v===x.wallet_status?'selected':''}>${v}</option>`).join('')}</select></td><td><input id="b_${x.user_id}" value="${x.wallet_balance||0}"></td><td><input id="p_${x.user_id}" value="${x.linked_principal||0}"></td><td><input id="n_${x.user_id}" value="${x.accumulated_pnl||0}"></td><td>${Number(x.return_rate||0).toFixed(2)}%</td><td><input id="e_${x.user_id}" type="datetime-local" value="${x.expires_at?new Date(x.expires_at).toISOString().slice(0,16):''}"></td><td><button class="btn primary" data-save="${x.user_id}">저장</button></td></tr>`).join('')||'<tr><td colspan="8">월렛 계정이 없습니다.</td></tr>'}</tbody></table></div></div>`;document.querySelectorAll('[data-ap]').forEach(b=>b.onclick=async()=>{await api(W,{action:'admin_approve',id:Number(b.dataset.ap),days:Number($('#d'+b.dataset.ap).value||30)});load()});document.querySelectorAll('[data-rj]').forEach(b=>b.onclick=async()=>{await api(W,{action:'admin_reject',id:Number(b.dataset.rj)});load()});document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{const u=b.dataset.save,e=$('#e_'+u).value;await api(W,{action:'admin_update',user_id:u,wallet_status:$('#s_'+u).value,wallet_balance:Number($('#b_'+u).value||0),linked_principal:Number($('#p_'+u).value||0),accumulated_pnl:Number($('#n_'+u).value||0),expires_at:e?new Date(e).toISOString():null,description:'월렛 관리자 정보 수정'});load()})}function logout(){localStorage.removeItem('veltro_wallet_admin');token='';location.reload()}$('#loginBtn').onclick=async()=>{try{$('#loginMsg').textContent='';const r=await api(AUTH,{action:'login',login_id:$('#id').value.trim(),password:$('#pw').value},false);if(r.profile?.role!=='admin')throw Error('관리자 계정이 아닙니다.');token=r.session.access_token;localStorage.setItem('veltro_wallet_admin',token);$('#login').classList.add('hidden');$('#app').classList.remove('hidden');await load()}catch(e){$('#loginMsg').textContent=e.message}};$('#pw').onkeydown=e=>{if(e.key==='Enter')$('#loginBtn').click()};$('#logout').onclick=logout;const t=localStorage.getItem('veltro_wallet_admin');if(t){token=t;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');load().catch(()=>logout())}</script></body></html>
