<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>VELTRO WALLET</title><style>:root{--bg:#06111e;--panel:#0b1c2d;--panel2:#102943;--line:#1f4161;--text:#ecf6ff;--muted:#8da7bc;--blue:#2f8cff;--cyan:#52c7ff;--good:#4ee39f;--bad:#ff6b7a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,rgba(47,140,255,.18),transparent 35%),linear-gradient(180deg,#040b13,#081727 55%,#06111e);color:var(--text);font-family:Arial,"Malgun Gothic",sans-serif;min-height:100vh}.wrap{max-width:1180px;margin:auto;padding:24px}.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:1.2px;font-size:24px}.mark{width:38px;height:38px;border:1px solid #5cbaff;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 24px rgba(47,140,255,.4)}.brand b{color:var(--cyan)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.logout,.btn{border:1px solid var(--line);background:#0d2236;color:#fff;border-radius:9px;height:40px;padding:0 15px;cursor:pointer}.btn.primary{border:0;background:linear-gradient(90deg,#1664d8,#36b7ff);font-weight:800}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(420px,94vw);padding:30px;border:1px solid var(--line);border-radius:18px;background:rgba(9,26,42,.94);box-shadow:0 28px 80px rgba(0,0,0,.42)}.login-card input{width:100%;height:46px;margin:7px 0;border-radius:9px;border:1px solid var(--line);background:#071421;color:#fff;padding:0 12px}.login-card button{width:100%;margin-top:10px;height:46px}.hidden{display:none!important}.hero{border:1px solid #234e73;background:linear-gradient(135deg,#0b1e32,#102e4b);border-radius:20px;padding:28px;display:grid;grid-template-columns:1.35fr .65fr;gap:20px;box-shadow:0 18px 50px rgba(0,0,0,.22)}.eyebrow{color:#68c7ff;font-size:12px;font-weight:800;letter-spacing:1.4px}.balance{font-size:42px;font-weight:900;margin:8px 0}.status-card{border:1px solid #2f5a7e;border-radius:14px;padding:18px;background:rgba(3,15,27,.35)}.status{font-weight:900;font-size:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}.card{border:1px solid var(--line);background:rgba(10,28,45,.9);border-radius:14px;padding:18px}.card small{color:var(--muted)}.value{font-size:23px;font-weight:900;margin-top:7px}.section{margin-top:18px;border:1px solid var(--line);background:rgba(9,25,41,.9);border-radius:15px;padding:18px}.section h3{margin:0 0 14px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:11px;border-bottom:1px solid #17344e;text-align:left}.table th{color:var(--muted);font-weight:600}.linkbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.linkbox input{height:40px;width:120px;border-radius:8px;border:1px solid var(--line);background:#071421;color:#fff;padding:0 10px}.msg{min-height:20px;color:#ff9aa5;font-size:12px;margin-top:8px}@media(max-width:760px){.wrap{padding:14px}.hero{grid-template-columns:1fr;padding:20px}.balance{font-size:33px}.grid{grid-template-columns:1fr 1fr}.top{align-items:flex-start}.table{font-size:11px}.table th,.table td{padding:8px 5px}}</style></head><body><div id="login" class="login"><div class="login-card"><div class="brand"><div class="mark">V</div>VEL<b>TRO</b> WALLET</div><p style="color:#8da7bc">VELTRO 계정으로 연동 월렛에 접속합니다.</p><input id="id" placeholder="아이디"><input id="pw" type="password" placeholder="비밀번호"><button id="loginBtn" class="btn primary">로그인</button><div id="loginMsg" class="msg"></div></div></div><div id="app" class="hidden"><div class="wrap"><div class="top"><div class="brand"><div class="mark">V</div>VEL<b>TRO</b> WALLET</div><button id="logout" class="logout">로그아웃</button></div><div id="body"></div></div></div><script>const U='https://mzjkvakigwtlibwlslhq.supabase.co',K='sb_publishable_E3h8Gqx-RQqvAxiNXvBhKQ_WZIfGd4t',AUTH=U+'/functions/v1/auth-api',WALLET=U+'/functions/v1/wallet-api';let token='',refreshToken='';const $=s=>document.querySelector(s),fmt=v=>Number(v||0).toLocaleString('ko-KR'),date=v=>v?new Date(v).toLocaleString('ko-KR'):'-';function remain(v){if(!v)return '-';return Math.max(0,Math.ceil((new Date(v)-Date.now())/86400000))+'일'}async function api(url,body,auth=true){const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json',apikey:K,...(auth&&token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'request_failed');return j}function statusKo(s){return({UNLINKED:'미연동',PENDING:'승인대기',ACTIVE:'연동중',EXPIRED:'만료',DISCONNECTED:'연동해제',SUSPENDED:'이용정지'})[s]||s}function txKo(s){return({LINK:'연동',UNLINK:'연동해제',BALANCE_ADJUST:'잔고조정',PNL_ADJUST:'손익조정',SYNC:'동기화',CREDIT:'입금',DEBIT:'출금'})[s]||s}async function load(){const r=await api(WALLET,{action:'overview'}),w=r.wallet||{},tx=r.transactions||[],reqs=r.requests||[];let action='';if(w.wallet_status==='UNLINKED'||w.wallet_status==='EXPIRED'||w.wallet_status==='DISCONNECTED')action=`<div class="section"><h3>Wallet Link</h3><div class="linkbox"><input id="days" inputmode="numeric" value="30"><span>일 연동</span><button id="req" class="btn primary">연동 신청</button></div><div class="msg" id="msg"></div></div>`;else if(w.wallet_status==='PENDING')action=`<div class="section"><h3>Wallet Link</h3><p style="color:#8da7bc">현재 관리자 승인 대기 중입니다.</p></div>`;$('#body').innerHTML=`<section class="hero"><div><div class="eyebrow">LINKED ASSET OVERVIEW</div><div style="color:#8da7bc;margin-top:10px">총 월렛 자산</div><div class="balance">${fmt(w.wallet_balance)} <span style="font-size:16px;color:#8da7bc">KRW</span></div><div style="color:#8da7bc">${r.profile?.login_id||''} · ${r.profile?.display_name||''}</div></div><div class="status-card"><small style="color:#8da7bc">Wallet Link 상태</small><div class="status" style="margin-top:7px">${statusKo(w.wallet_status)}</div><div style="margin-top:18px;color:#8da7bc;font-size:12px">연동일 ${date(w.linked_at)}<br>만료일 ${date(w.expires_at)}<br>남은기간 ${remain(w.expires_at)}</div></div></section><div class="grid"><div class="card"><small>연동 원금</small><div class="value">${fmt(w.linked_principal)}원</div></div><div class="card"><small>누적 손익</small><div class="value" style="color:${Number(w.accumulated_pnl)>=0?'#4ee39f':'#ff6b7a'}">${Number(w.accumulated_pnl)>=0?'+':''}${fmt(w.accumulated_pnl)}원</div></div><div class="card"><small>수익률</small><div class="value">${Number(w.return_rate||0).toFixed(2)}%</div></div><div class="card"><small>최근 동기화</small><div class="value" style="font-size:15px">${date(w.last_synced_at)}</div></div></div>${action}<div class="section"><h3>월렛 거래내역</h3><div style="overflow:auto"><table class="table"><thead><tr><th>일시</th><th>구분</th><th>금액</th><th>잔고</th><th>내용</th></tr></thead><tbody>${tx.map(x=>`<tr><td>${date(x.created_at)}</td><td>${txKo(x.tx_type)}</td><td>${fmt(x.amount)}</td><td>${fmt(x.balance_after)}</td><td>${x.description||'-'}</td></tr>`).join('')||'<tr><td colspan="5">내역이 없습니다.</td></tr>'}</tbody></table></div></div>`;const b=$('#req');if(b)b.onclick=async()=>{try{await api(WALLET,{action:'request_link',requested_days:Number($('#days').value||30)});await load()}catch(e){$('#msg').textContent=e.message}}}function saveSession(s){token=s.access_token;refreshToken=s.refresh_token;localStorage.setItem('veltro_wallet_session',JSON.stringify({token,refreshToken}))}function restore(){try{const s=JSON.parse(localStorage.getItem('veltro_wallet_session')||'{}');if(s.token){token=s.token;refreshToken=s.refreshToken;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');load().catch(()=>logout())}}catch{}}function logout(){localStorage.removeItem('veltro_wallet_session');token='';location.reload()}$('#loginBtn').onclick=async()=>{try{$('#loginMsg').textContent='';const r=await api(AUTH,{action:'login',login_id:$('#id').value.trim(),password:$('#pw').value},false);saveSession(r.session);$('#login').classList.add('hidden');$('#app').classList.remove('hidden');await load()}catch(e){$('#loginMsg').textContent=e.message==='invalid_credentials'?'아이디 또는 비밀번호를 확인하세요.':e.message}};$('#pw').onkeydown=e=>{if(e.key==='Enter')$('#loginBtn').click()};$('#logout').onclick=logout;restore();</script></body></html>
