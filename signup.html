<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VELTRO 회원가입</title>
<style>
:root{--brand:#1687d9;--brand2:#38bdf8;--bg:#07121d;--line:#d8dee7;--muted:#667085}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 75% 15%,rgba(56,189,248,.18),transparent 30%),linear-gradient(145deg,#07121d,#173248);font-family:Arial,"Malgun Gothic",sans-serif;color:#111827;display:grid;place-items:center;padding:18px}.card{width:min(520px,100%);background:#fff;border-radius:16px;padding:28px;box-shadow:0 24px 60px rgba(0,0,0,.32)}.logo{font-size:25px;font-weight:900;letter-spacing:1px}.logo b{color:var(--brand2)}h1{font-size:20px;margin:14px 0 5px}.desc{font-size:12px;color:var(--muted);margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}input{width:100%;height:42px;border:1px solid #c9d1db;border-radius:7px;padding:0 11px;font:inherit}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.actions button{height:44px;border-radius:7px;font-weight:800;cursor:pointer}.back{background:#fff;border:1px solid #c9d1db}.submit{border:0;background:linear-gradient(90deg,var(--brand),var(--brand2));color:#fff}.msg{min-height:22px;margin-top:12px;font-size:12px;color:#c33}.ok{color:#08795b}@media(max-width:600px){.card{padding:22px}.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<div class="card"><div class="logo">VEL<b>TRO</b></div><h1>회원가입</h1><div class="desc">가입 신청 후 승인 완료 시 로그인할 수 있습니다.</div><div class="grid">
<div><label>아이디</label><input id="loginId" autocomplete="username" placeholder="영문/숫자 4~30자"></div>
<div><label>비밀번호</label><input id="password" type="password" autocomplete="new-password" placeholder="8자 이상"></div>
<div><label>이름 / 예금주</label><input id="holder" placeholder="이름"></div>
<div><label>생년월일</label><input id="birth" type="date"></div>
<div><label>휴대폰</label><input id="phone" inputmode="tel" placeholder="010-0000-0000"></div>
<div><label>이메일</label><input id="email" type="email" placeholder="example@email.com"></div>
<div><label>은행</label><input id="bank" placeholder="은행명"></div>
<div><label>계좌번호</label><input id="account" inputmode="numeric" placeholder="계좌번호"></div>
<div class="full"><label>추천인 코드를 입력하세요</label><input id="code" placeholder="추천인 코드"></div>
</div><div class="actions"><button class="back" id="back">로그인으로</button><button class="submit" id="submit">가입 신청</button></div><div id="msg" class="msg"></div></div>
<script>
const U='https://mzjkvakigwtlibwlslhq.supabase.co',K='sb_publishable_E3h8Gqx-RQqvAxiNXvBhKQ_WZIfGd4t',AUTH=U+'/functions/v1/auth-api';
const $=s=>document.querySelector(s);function textError(e){const m={invalid_login_id:'아이디는 영문/숫자/._- 조합 4~30자로 입력하세요.',weak_password:'비밀번호는 8자 이상 입력하세요.',invalid_email:'이메일 형식을 확인하세요.',missing_fields:'필수 항목을 모두 입력하세요.',invalid_signup_code:'추천인 코드를 확인하세요.',expired_signup_code:'만료된 추천인 코드입니다.',signup_code_exhausted:'사용이 종료된 추천인 코드입니다.',login_id_taken:'이미 사용 중인 아이디입니다.'};return m[e]||e||'가입 신청에 실패했습니다.'}
$('#back').onclick=()=>{if(history.length>1)history.back();else location.href='/'};
$('#submit').onclick=async()=>{const b=$('#submit'),msg=$('#msg');try{b.disabled=true;msg.className='msg';msg.textContent='가입 신청 중...';const body={action:'signup',login_id:$('#loginId').value.trim(),password:$('#password').value,phone:$('#phone').value.trim(),bank_name:$('#bank').value.trim(),bank_account:$('#account').value.trim(),account_holder:$('#holder').value.trim(),email:$('#email').value.trim(),signup_code:$('#code').value.trim(),birth_date:$('#birth').value};const r=await fetch(AUTH,{method:'POST',headers:{'content-type':'application/json',apikey:K,Authorization:'Bearer '+K},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||j.detail||'signup_failed');msg.className='msg ok';msg.textContent='가입 신청이 완료되었습니다. 승인 후 로그인해 주세요.';setTimeout(()=>location.href='/',1600)}catch(e){msg.className='msg';msg.textContent=textError(e.message)}finally{b.disabled=false}};
</script>
</body></html>
